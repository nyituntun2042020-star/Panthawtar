<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f4f7f6;color:#182321;font-size:15px}
body.dk{background:#0d1117;color:#e6edf3}
header{position:sticky;top:0;z-index:20;background:#0f766e;color:#fff;padding:10px 13px;display:flex;align-items:center;gap:8px}
header b{font-size:16px}
#clk{margin-left:auto;font-size:13px}
.tg{background:rgba(255,255,255,.2);color:#fff;padding:5px 8px;border-radius:8px;border:0;font-size:14px}
.nav{position:sticky;top:44px;z-index:19;background:#fff;display:flex;gap:5px;overflow-x:auto;padding:6px;border-bottom:1px solid #e0e5e4}
body.dk .nav{background:#161b22;border-color:#30363d}
.nav button{white-space:nowrap;font-size:12px;padding:6px 9px;background:#e8efee;color:#0f766e;border:0;border-radius:7px;font-weight:600}

.wrap{max-width:1100px;margin:auto;padding:10px 12px 80px}
.cd{background:#fff;border-radius:10px;padding:11px;margin:8px 0;box-shadow:0 1px 4px #0001}
body.dk .cd{background:#161b22}
.st{font-size:17px;font-weight:800}
.mt{color:#667;font-size:12px}
body.dk .mt{color:#8b949e}label{display:block;font-weight:600;margin:6px 0 3px;font-size:13px}
input,select{width:100%;padding:9px;border:1px solid #ccd5d3;border-radius:7px;font-size:15px;background:#fff;color:#182321}

button{border:0;border-radius:7px;padding:8px 11px;background:#0f766e;color:#fff;font-weight:600;font-size:13px}
.sf{background:#e8efee;color:#0f766e}
body.dk .sf{background:#21262d;color:#2dd4bf}
.dg{background:#b42318}
.sm{padding:4px 8px;font-size:11px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row>*{flex:1;min-width:110px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{padding:6px;border-bottom:1px solid #e0e5e4;text-align:left}
body.dk .tbl th,body.dk .tbl td{border-color:#30363d}
.tbl th{background:#e8efee;font-weight:700}
body.dk .tbl th{background:#21262d}
.tblWrap{overflow-x:auto;margin:6px 0}
.ep{text-align:center;color:#667;padding:15px}
.ps{color:#087443}
.ng{color:#b42318}
.rc{border-top:1px solid #e0e5e4;padding:8px 0}

.itR,.bgR{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap;background:#e8efee;padding:6px;border-radius:7px}

.itR select,.bgR select{flex:2;min-width:80px}

.tot{background:#e8efee;padding:9px;border-radius:7px;margin-top:6px;font-size:12px}

.tot div{display:flex;justify-content:space-between;padding:2px 0}

.md{position:fixed;inset:0;background:#000c;z-index:50;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.md .bx{background:#fff;border-radius:11px;max-width:650px;width:100%;max-height:92vh;overflow:auto;padding:14px}

.nt.w{background:#fef3c7;color:#78350f}
.secTitle{background:#0f766e;color:#fff;padding:7px 11px;border-radius:7px;font-size:14px;font-weight:700;margin:12px 0 6px}
.tag{display:inline-block;padding:2px 6px;border-radius:5px;font-size:10px;font-weight:700;margin-right:3px;background:#e8efee}

<body>
<header><b>🌿 ပန်းသော်တာ</b><button class="tg" id="themeBtn" onclick="tglTheme()">🌙</button><span id="clk"></span></header>
<div class="nav" id="nav"></div>
<main class="wrap" id="app"></main>
<div id="modal"></div>
<script>var K='ptt_v4',TH='ptt_th',app=document.getElementById('app'),mod=document.getElementById('modal');
var N=function(x){return Number(x)||0;};
var money=function(x){return N(x).toLocaleString('en-US',{maximumFractionDigits:2})+' ကျပ်';};
var qty=function(x){return N(x).toLocaleString('en-US',{maximumFractionDigits:2});};
var today=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});};
var uid=function(){return Date.now()+Math.floor(Math.random()*1000);};
var sum=function(a,k){if(!a)return 0;var t=0;for(var i=0;i<a.length;i++)t+=N(a[i][k]);return t;};
var BANKS=['KBZ','AYA','CB','Wave','Kpay','UAB','Yoma','AGD','အခြား'];
setInterval(function(){var c=document.getElementById('clk');if(c)c.innerText=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});},1000);

var DEF={items:['ဖာလာ','ဘောဖာလာ','ဂေဂေါဖာလာ'],customers:[],purchases:[],sales:[],deposits:[],precuts:[],loans:[],cars:[],expenses:[]};
var db={items:DEF.items.slice(),customers:[],purchases:[],sales:[],deposits:[],precuts:[],loans:[],cars:[],expenses:[]};
try{var sv=localStorage.getItem(K);if(sv){var pp=JSON.parse(sv);if(pp&&pp.items)db=pp;}}catch(e){}
try{
  for(var i=0;i<db.purchases.length;i++){var x=db.purchases[i];if(!x.items)x.items=x.item?[{item:x.item,w:N(x.w),price:N(x.price),bags:N(x.bags)}]:[];x.total=N(x.total)||x.items.reduce(function(s,it){return s+N(it.w)*N(it.price);},0);x.payments=x.payments||[];x.photo=x.photo||'';x.driverName=x.driverName||'';x.carRate=N(x.carRate);x.carFee=N(x.carFee);x.note=x.note||'';}
  for(var i=0;i<db.sales.length;i++){var x=db.sales[i];if(!x.items)x.items=x.item?[{item:x.item,w:N(x.w),price:N(x.price)}]:[];x.total=N(x.total)||x.items.reduce(function(s,it){return s+N(it.w)*N(it.price);},0);x.payments=x.payments||[];x.photo=x.photo||'';x.note=x.note||'';}
  for(var i=0;i<db.cars.length;i++){var c=db.cars[i];if(!c.items)c.items=[];c.carRate=N(c.carRate);c.driverName=c.driverName||'';c.driverPhone=c.driverPhone||'';c.deliverTo=c.deliverTo||'';c.carPhoto=c.carPhoto||'';c.invoicePhoto=c.invoicePhoto||'';}
  for(var i=0;i<db.deposits.length;i++){var d=db.deposits[i];if(!d.items)d.items=[];d.fixes=d.fixes||[];d.driverName=d.driverName||'';d.carFee=N(d.carFee);}
  for(var i=0;i<db.precuts.length;i++){var p=db.precuts[i];if(!p.items)p.items=[];p.deliveries=p.deliveries||[];p.driverName=p.driverName||'';p.carFee=N(p.carFee);}
  for(var i=0;i<db.loans.length;i++){db.loans[i].payments=db.loans[i].payments||[];db.loans[i].note=db.loans[i].note||'';}
  for(var i=0;i<db.expenses.length;i++){db.expenses[i].note=db.expenses[i].note||'';}
}catch(e){}

function save(){try{localStorage.setItem(K,JSON.stringify(db));return true;}catch(e){alert('⚠️ Storage ပြည့်နေပါ');return false;}}
function findC(n){for(var i=0;i<db.customers.length;i++)if(db.customers[i].name===n)return db.customers[i];return null;}
function addC(n,p){n=String(n||'').trim();if(!n)return;if(!findC(n)){db.customers.push({name:n,phone:p||'',address:''});save();}}
function cList(){var s='';for(var i=0;i<db.customers.length;i++)s+='<option value="'+esc(db.customers[i].name)+'"></option>';return s;}
function cSel(sel){var s='<option value="">— အားလုံး —</option>';for(var i=0;i<db.customers.length;i++){var c=db.customers[i].name;s+='<option'+(c===sel?' selected':'')+'>'+esc(c)+'</option>';}return s;}
function itemSel(sel){var s='<option value="">— အားလုံး —</option>';for(var i=0;i<db.items.length;i++){var it=db.items[i];s+='<option'+(it===sel?' selected':'')+'>'+esc(it)+'</option>';}return s;}
function bankSel(sel){var s='<option value="">— မရွေး —</option>';for(var i=0;i<BANKS.length;i++){var b=BANKS[i];s+='<option'+(b===sel?' selected':'')+'>'+b+'</option>';}return s;}
function cBal(name){var st=0,sp=0,pt=0,pp=0;for(var i=0;i<db.sales.length;i++){if(db.sales[i].person===name){st+=N(db.sales[i].total);sp+=sum(db.sales[i].payments,'amount');}}for(var i=0;i<db.purchases.length;i++){if(db.purchases[i].person===name){pt+=N(db.purchases[i].total);pp+=sum(db.purchases[i].payments,'amount');}}return {st:st,sp:sp,pt:pt,pp:pp,they:st-sp,we:pt-pp,net:(st-sp)-(pt-pp)};}
function opts(sel){sel=sel||'';var h='';for(var i=0;i<db.items.length;i++){var it=db.items[i];h+='<option'+(it===sel?' selected':'')+'>'+esc(it)+'</option>';}return h;}
function brief(items){if(!items||!items.length)return '-';var a=[];for(var i=0;i<items.length;i++)a.push(items[i].item);return a.join('+');}
function hasItem(items,item){if(!items)return false;for(var i=0;i<items.length;i++)if(items[i].item===item)return true;return false;}function stock(item){var a=0,b=0;for(var i=0;i<db.purchases.length;i++){var p=db.purchases[i];for(var j=0;j<p.items.length;j++)if(p.items[j].item===item)a+=N(p.items[j].w);}for(var i=0;i<db.precuts.length;i++){var p=db.precuts[i];for(var j=0;j<p.items.length;j++)if(p.items[j].item===item)a+=N(p.items[j].w);}for(var i=0;i<db.deposits.length;i++){var d=db.deposits[i];for(var j=0;j<(d.fixes||[]).length;j++)if(d.fixes[j].item===item)a+=N(d.fixes[j].w);}for(var i=0;i<db.sales.length;i++){var s=db.sales[i];for(var j=0;j<s.items.length;j++)if(s.items[j].item===item)b+=N(s.items[j].w);}return a-b;}
function itemPurchased(item){var a=0;for(var i=0;i<db.purchases.length;i++){var p=db.purchases[i];for(var j=0;j<p.items.length;j++)if(p.items[j].item===item)a+=N(p.items[j].w);}return a;}
function itemPrecut(item){var a=0;for(var i=0;i<db.precuts.length;i++){var p=db.precuts[i];for(var j=0;j<p.items.length;j++)if(p.items[j].item===item)a+=N(p.items[j].w);}return a;}
function itemDepositFix(item){var a=0;for(var i=0;i<db.deposits.length;i++){var d=db.deposits[i];for(var j=0;j<(d.fixes||[]).length;j++)if(d.fixes[j].item===item)a+=N(d.fixes[j].w);}return a;}
function itemTotalBuy(item){return itemPurchased(item)+itemPrecut(item)+itemDepositFix(item);}
function itemSold(item){var b=0;for(var i=0;i<db.sales.length;i++){var s=db.sales[i];for(var j=0;j<s.items.length;j++)if(s.items[j].item===item)b+=N(s.items[j].w);}return b;}
function itemDepositRemain(item){var a=0;for(var i=0;i<db.deposits.length;i++){var d=db.deposits[i];for(var j=0;j<d.items.length;j++)if(d.items[j].item===item)a+=N(d.items[j].w);}return a-itemDepositFix(item);}
function itemPrecutRemain(item){var a=0;for(var i=0;i<db.precuts.length;i++){var p=db.precuts[i];for(var j=0;j<p.items.length;j++)if(p.items[j].item===item)a+=N(p.items[j].w);}var del=0;for(var i=0;i<db.precuts.length;i++){var p=db.precuts[i];for(var j=0;j<(p.deliveries||[]).length;j++)if(p.deliveries[j].item===item)del+=N(p.deliveries[j].w);}return a-del;}
function avgBuy(item){var w=0,v=0;for(var i=0;i<db.purchases.length;i++){var p=db.purchases[i];for(var j=0;j<p.items.length;j++)if(p.items[j].item===item){w+=N(p.items[j].w);v+=N(p.items[j].w)*N(p.items[j].price);}}for(var i=0;i<db.precuts.length;i++){var p=db.precuts[i];for(var j=0;j<p.items.length;j++)if(p.items[j].item===item){w+=N(p.items[j].w);v+=N(p.items[j].w)*N(p.items[j].price);}}for(var i=0;i<db.deposits.length;i++){var d=db.deposits[i];for(var j=0;j<(d.fixes||[]).length;j++){var f=d.fixes[j];if(f.item===item){w+=N(f.w);v+=N(f.w)*N(f.price);}}}return w>0?v/w:0;}
function avgSell(item){var w=0,v=0;for(var i=0;i<db.sales.length;i++){var s=db.sales[i];for(var j=0;j<s.items.length;j++)if(s.items[j].item===item){w+=N(s.items[j].w);v+=N(s.items[j].w)*N(s.items[j].price);}}return w>0?v/w:0;}
function purchaseCost(){var t=0;for(var i=0;i<db.purchases.length;i++)t+=N(db.purchases[i].total);for(var i=0;i<db.precuts.length;i++)t+=N(db.precuts[i].total);for(var i=0;i<db.deposits.length;i++){var d=db.deposits[i];for(var j=0;j<(d.fixes||[]).length;j++)t+=N(d.fixes[j].w)*N(d.fixes[j].price);}return t;}
function saleAll(){var t=0;for(var i=0;i<db.sales.length;i++)t+=N(db.sales[i].total);return t;}
function expAll(){var t=0;for(var i=0;i<db.expenses.length;i++)t+=N(db.expenses[i].amount);return t;}
function carWeight(c){var t=0;if(c.items)for(var i=0;i<c.items.length;i++)t+=N(c.items[i].bags)*N(c.items[i].wpb);return t;}
function carFee(c){return Math.floor(N(c.carRate))*carWeight(c);}
function pendingFor(p){var m={};for(var i=0;i<db.sales.length;i++){var s=db.sales[i];if(s.person===p)for(var j=0;j<s.items.length;j++){var it=s.items[j];if(!m[it.item])m[it.item]={item:it.item,sold:0,loaded:0};m[it.item].sold+=N(it.w);}}for(var i=0;i<db.cars.length;i++){var c=db.cars[i];if(c.person===p)for(var j=0;j<c.items.length;j++){var it=c.items[j];if(!m[it.item])m[it.item]={item:it.item,sold:0,loaded:0};m[it.item].loaded+=N(it.bags)*N(it.wpb);}}var r=[];for(var k in m){var v=m[k];v.pending=v.sold-v.loaded;if(v.pending>0.001)r.push(v);}return r;}
function allPending(){var m={};for(var i=0;i<db.sales.length;i++){var s=db.sales[i];for(var j=0;j<s.items.length;j++){var it=s.items[j];if(!m[s.person])m[s.person]={person:s.person,items:{}};if(!m[s.person].items[it.item])m[s.person].items[it.item]={sold:0,loaded:0};m[s.person].items[it.item].sold+=N(it.w);}}for(var i=0;i<db.cars.length;i++){var c=db.cars[i];for(var j=0;j<c.items.length;j++){var it=c.items[j];if(!m[c.person])m[c.person]={person:c.person,items:{}};if(!m[c.person].items[it.item])m[c.person].items[it.item]={sold:0,loaded:0};m[c.person].items[it.item].loaded+=N(it.bags)*N(it.wpb);}}var r=[];for(var p in m){var o=m[p];var arr=[];for(var k in o.items){var v=o.items[k];var pd=v.sold-v.loaded;if(pd>0.001)arr.push({item:k,pending:pd});}if(arr.length)r.push({person:p,items:arr});}return r;}
function topBuy(){var m={};function add(p,i,w,a){if(!p||!i)return;var k=p+'|'+i;if(!m[k])m[k]={person:p,item:i,w:0,amount:0};m[k].w+=N(w);m[k].amount+=N(a);}for(var i=0;i<db.purchases.length;i++){var e=db.purchases[i];for(var j=0;j<e.items.length;j++){var it=e.items[j];add(e.person,it.item,it.w,N(it.w)*N(it.price));}}for(var i=0;i<db.precuts.length;i++){var e=db.precuts[i];for(var j=0;j<e.items.length;j++){var it=e.items[j];add(e.person,it.item,it.w,N(it.w)*N(it.price));}}for(var i=0;i<db.deposits.length;i++){var e=db.deposits[i];for(var j=0;j<(e.fixes||[]).length;j++){var f=e.fixes[j];add(e.person,f.item,f.w,N(f.w)*N(f.price));}}var r=[];for(var k in m){var v=m[k];v.avg=v.w>0?v.amount/v.w:0;r.push(v);}r.sort(function(a,b){return b.amount-a.amount;});return r.slice(0,20);}
function topSale(){var m={};for(var i=0;i<db.sales.length;i++){var e=db.sales[i];for(var j=0;j<e.items.length;j++){var it=e.items[j];if(!e.person||!it.item)continue;var k=e.person+'|'+it.item;if(!m[k])m[k]={person:e.person,item:it.item,w:0,amount:0};m[k].w+=N(it.w);m[k].amount+=N(it.w)*N(it.price);}}var r=[];for(var k in m){var v=m[k];v.avg=v.w>0?v.amount/v.w:0;r.push(v);}r.sort(function(a,b){return b.amount-a.amount;});return r.slice(0,20);}
function countItems(arr,item){var c=0;for(var i=0;i<arr.length;i++){var a=arr[i];if(!a.items)continue;for(var j=0;j<a.items.length;j++)if(a.items[j].item===item)c++;}return c;}function addIt(px,item,w,price,bags,wb){wb=wb||false;item=item||'';w=w||'';price=price||'';bags=bags||'';var b=document.getElementById(px+'_items');if(!b)return;var d=document.createElement('div');d.className='itR';d.innerHTML='<select class="itS">'+opts(item)+'</select><input class="itW" type="number" step="any" placeholder="ပိဿာ" value="'+w+'" oninput="recalc(\''+px+'\')"><input class="itP" type="number" step="any" placeholder="ဈေး" value="'+price+'" oninput="recalc(\''+px+'\')">'+(wb?'<input class="itB" type="number" step="any" placeholder="အိတ်" value="'+bags+'">':'')+'<button class="dg sm" type="button" onclick="this.parentElement.remove();recalc(\''+px+'\')">×</button>';b.appendChild(d);recalc(px);}
function colIt(px,wb){wb=wb||false;var b=document.getElementById(px+'_items');if(!b)return[];var rows=b.querySelectorAll('.itR');var a=[];for(var i=0;i<rows.length;i++){var r=rows[i];var item=r.querySelector('.itS').value;var w=N(r.querySelector('.itW').value);var price=N(r.querySelector('.itP').value);var bE=r.querySelector('.itB');var bags=bE?N(bE.value):0;if(item&&(w>0||bags>0))a.push({item:item,w:w,price:price,bags:bags});}return a;}
function recalc(px){var items=colIt(px);var gross=0;for(var i=0;i<items.length;i++)gross+=items[i].w*items[i].price;var re=document.getElementById(px+'_carRate');var rate=re?N(re.value):0;var fl=0;for(var i=0;i<items.length;i++)fl+=Math.floor(N(items[i].w));var fee=rate*fl;var tw=0;for(var i=0;i<items.length;i++)tw+=N(items[i].w);var g=document.getElementById(px+'_gross');if(g)g.textContent=money(gross);var wt=document.getElementById(px+'_weight');if(wt)wt.textContent=qty(tw)+' ပိဿာ';var fe=document.getElementById(px+'_floors');if(fe)fe.textContent=fl;var f=document.getElementById(px+'_fee');if(f)f.textContent=money(fee);var n=document.getElementById(px+'_net');if(n)n.textContent=money(gross-fee);}
function addBg(px,item,bags,wpb){item=item||'';bags=bags||'';wpb=wpb||'';var b=document.getElementById(px+'_bags');if(!b)return;var d=document.createElement('div');d.className='bgR';d.innerHTML='<select class="bgS">'+opts(item)+'</select><input class="bgB" type="number" step="any" placeholder="အိတ်ရေ" value="'+bags+'" oninput="recalcCar(\''+px+'\')"><input class="bgW" type="number" step="any" placeholder="1အိတ်/ပိဿာ" value="'+wpb+'" oninput="recalcCar(\''+px+'\')"><button class="dg sm" type="button" onclick="this.parentElement.remove();recalcCar(\''+px+'\')">×</button>';b.appendChild(d);recalcCar(px);}
function colBg(px){var b=document.getElementById(px+'_bags');if(!b)return[];var rows=b.querySelectorAll('.bgR');var a=[];for(var i=0;i<rows.length;i++){var r=rows[i];var item=r.querySelector('.bgS').value;var bags=N(r.querySelector('.bgB').value);var wpb=N(r.querySelector('.bgW').value);if(item&&bags>0&&wpb>0)a.push({item:item,bags:bags,wpb:wpb});}return a;}
function recalcCar(px){var items=colBg(px);var tw=0;for(var i=0;i<items.length;i++)tw+=N(items[i].bags)*N(items[i].wpb);var re=document.getElementById(px+'_carRate');var rate=re?N(re.value):0;var w=document.getElementById(px+'_carWeight');if(w)w.textContent=qty(tw)+' ပိဿာ';var f=document.getElementById(px+'_carFee');if(f)f.textContent=money(Math.floor(rate)*tw);}

function readP(id,cb){var el=document.getElementById(id);var f=el?el.files[0]:null;if(!f)return cb('');var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var mx=600,sc=Math.min(1,mx/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6));};im.src=r.result;};r.readAsDataURL(f);}
function readFile(f,cb){if(!f)return cb('');var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var mx=600,sc=Math.min(1,mx/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6));};im.src=r.result;};r.readAsDataURL(f);}function shell(t,b){app.innerHTML='<h2 style="margin:5px 0 8px;font-size:18px">'+t+'</h2>'+b;}

}

  var h=entryForm('p','purchase','အဝယ်အသစ်');
  h+='<div class="cd"><h3>📊 Avg ဝယ်</h3><div class="tblWrap"><table class="tbl"><tr><th>ပစ္စည်း</th><th>စုစုပေါင်း</th><th>Avg</th></tr>'+(st||'<tr><td colspan="3" class="ep">မရှိ</td></tr>')+'</table></div></div>';
  h+='<div class="cd"><h3>🏆 Top 20</h3><div class="tblWrap"><table class="tbl"><tr><th>Customer</th><th>Item</th><th>ပိဿာ</th><th>Avg</th><th>Amount</th></tr>'+(th||'<tr><td colspan="5" class="ep">မရှိ</td></tr>')+'</table></div></div>';

function txList(kind,list){if(!list.length)return '<div class="ep">မရှိ</div>';var sorted=list.slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date));}).slice(0,30);var h='';var coll={purchase:'purchases',sale:'sales',precut:'precuts',deposit:'deposits'}[kind];var lbl={purchase:'အဝယ်',sale:'အရောင်း',precut:'ကြိုဖြတ်',deposit:'အပ်'}[kind];for(var k=0;k<sorted.length;k++){var x=sorted[k];var its='';if(x.items)for(var i=0;i<x.items.length;i++){var it=x.items[i];its+='<div style="margin-left:10px">• '+esc(it.item)+' · '+qty(it.w)+'×'+money(it.price)+' = '+money(it.w*it.price)+(kind!=='sale'&&N(it.bags)>0?' · အိတ် '+qty(it.bags):'')+'</div>';}var car=kind!=='sale'&&(N(x.carFee)>0||x.driverName)?'<div class="mt">🚛 '+(x.driverName?esc(x.driverName)+' · ':'')+'ကားခ '+money(x.carFee)+'</div>':'';h+='<div class="rc"><div><span class="tag">'+lbl+'</span> <b>'+esc(x.person)+'</b> · '+esc(x.date)+'</div>'+its+car+'<div><b>Total: '+money(N(x.total))+'</b></div>'+(x.note?'<div class="mt">📝 '+esc(x.note)+'</div>':'')+thumb(x.photo)+'<div class="row" style="margin-top:4px"><button class="sf sm" onclick="openEdit(\''+kind+'\','+x.id+')">✏️</button><button class="dg sm" onclick="delTx(\''+coll+'\','+x.id+')">🗑️</button></div></div>';}return h;}

function addFix(dId){var d=null;for(var i=0;i<db.deposits.length;i++)if(db.deposits[i].id===dId){d=db.deposits[i];break;}if(!d)return;var rem={};for(var i=0;i<d.items.length;i++){var it=d.items[i];var fixed=0;for(var j=0;j<(d.fixes||[]).length;j++)if(d.fixes[j].item===it.item)fixed+=N(d.fixes[j].w);rem[it.item]=N(it.w)-fixed;}var avail=[];for(var k in rem)if(rem[k]>0.001)avail.push(k);if(!avail.length)return alert('ထုတ်ပြီး');var item=avail.length===1?avail[0]:prompt('ပစ္စည်း ('+avail.join(',')+')',avail[0]);if(!item||!rem[item])return;var w=prompt('ပိဿာ (ကျန် '+qty(rem[item])+')',rem[item]);if(w===null)return;var wt=N(w);if(wt<=0||wt>rem[item]+0.01)return alert('မှန်ကန်စွာ');var price=prompt('ဈေး','0');if(price===null)return;d.fixes=d.fixes||[];d.fixes.push({id:uid(),date:today(),item:item,w:wt,price:N(price),note:''});save();deposit();}function precut(){var list=db.precuts.slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date));}).slice(0,30);var h='';for(var k=0;k<list.length;k++){var p=list[k];var its='';for(var i=0;i<p.items.length;i++){var it=p.items[i];its+=esc(it.item)+': '+qty(it.w)+(N(it.bags)>0?' ('+qty(it.bags)+'အိတ်)':'');if(i<p.items.length-1)its+=' · ';}var dvh='';for(var i=0;i<(p.deliveries||[]).length;i++){var v=p.deliveries[i];dvh+='<div class="mt" style="margin-left:10px">↳ '+esc(v.date)+' · '+esc(v.item||'')+' · '+qty(v.w)+' <button class="dg sm" onclick="delSub(\'precut\','+p.id+','+v.id+')">×</button></div>';}h+='<div class="rc"><div><b>'+esc(p.person)+'</b> · '+esc(p.date)+'</div><div>'+its+'</div>'+(p.driverName||N(p.carFee)?'<div class="mt">🚛 '+esc(p.driverName||'')+' · ကားခ '+money(p.carFee)+'</div>':'')+'<div><b>Total: '+money(N(p.total))+'</b></div>'+thumb(p.photo)+dvh+'<div class="row" style="margin-top:4px"><button class="sf sm" onclick="addDel('+p.id+')">➕ သွင်း</button><button class="sf sm" onclick="openEdit(\'precut\','+p.id+')">✏️</button><button class="dg sm" onclick="delTx(\'precuts\','+p.id+')">🗑️</button></div></div>';}

var _ec=null,_ep='',_ecp='',_eip='';

function closeE(){_ec=null;_ep='';_ecp='';_eip='';closeM();}

function saveE(){if(!_ec)return;var kind=_ec.kind,an=_ec.an;var rec=null;for(var i=0;i<db[an].length;i++)if(db[an][i].id===_ec.r.id){rec=db[an][i];break;}if(!rec)return;if(kind==='car'){var items=colBg('e');if(!items.length)return alert('ကုန်');rec.date=document.getElementById('e_date').value;rec.person=document.getElementById('e_person').value.trim();rec.carNo=document.getElementById('e_carNo').value.trim();rec.driverName=document.getElementById('e_driver').value.trim();rec.driverPhone=document.getElementById('e_driverPhone').value.trim();rec.items=items;rec.carRate=Math.floor(N(document.getElementById('e_carRate').value));rec.deliverTo=document.getElementById('e_deliverTo').value;rec.carPhoto=_ecp;rec.invoicePhoto=_eip;addC(rec.person,rec.driverPhone);}else{var wb=kind!=='sale';var items=colIt('e',wb);if(!items.length)return alert('ပစ္စည်း');rec.date=document.getElementById('e_date').value;rec.person=document.getElementById('e_person').value.trim();rec.items=items;rec.grossAmount=items.reduce(function(s,it){return s+it.w*it.price;},0);if(kind!=='sale'){rec.driverName=document.getElementById('e_driver').value.trim();rec.carRate=Math.floor(N(document.getElementById('e_carRate').value));var fl=0;for(var i=0;i<items.length;i++)fl+=Math.floor(N(items[i].w));rec.carFee=rec.carRate*fl;}rec.netAmount=rec.grossAmount-(kind==='sale'?0:N(rec.carFee));rec.total=rec.netAmount;rec.note=document.getElementById('e_note').value;rec.photo=_ep;addC(rec.person);}save();closeE();alert('✅');render(curP());}function stockPage(){var h='';for(var i=0;i<db.items.length;i++){var k=db.items[i];h+='<tr><td><b>'+esc(k)+'</b></td><td>'+qty(itemTotalBuy(k))+'</td><td>'+qty(itemSold(k))+'</td><td>'+qty(itemDepositRemain(k))+'</td><td>'+qty(itemPrecutRemain(k))+'</td><td><b>'+qty(stock(k))+'</b></td><td>'+money(avgBuy(k))+'</td><td>'+money(avgSell(k))+'</td></tr>';}
  shell('📦 Stock','<div class="cd"><div class="tblWrap"><table class="tbl"><tr><th>ပစ္စည်း</th><th>အဝယ်</th><th>ရောင်း</th><th>အပ်ကျန်</th><th>ကြိုဖြတ်ရရန်</th><th>လက်ကျန်</th><th>Avg ဝယ်</th><th>Avg ရောင်း</th></tr>'+h+'</table></div></div>');}

  summary+='<tr><td>ဝယ်စုစုပေါင်း</td><td><b>'+qty(itemTotalBuy(item))+' ပိဿာ</b></td></tr>';

  summary+='<tr><td>အပ်ကျန်</td><td><b>'+qty(itemDepositRemain(item))+' ပိဿာ</b></td></tr>';

function dailyPage(){shell('📅 နေ့စဉ်','<div class="cd"><div class="row"><label>စရက် <input id="df" type="date" value="'+today()+'"></label><label>ဆုံးရက် <input id="dt" type="date" value="'+today()+'"></label></div><div class="row"><label>Customer <select id="dcust">'+cSel('')+'</select></label><label>Item <select id="ditem">'+itemSel('')+'</select></label></div><div class="row"><button onclick="rDaily()">🔍 ကြည့်မည်</button><button class="sf" onclick="resetDaily()">↻ Reset</button><button class="sf" onclick="exportCSV()">📄 CSV</button></div></div><div id="dRes"></div>');rDaily();}
function resetDaily(){document.getElementById('df').value=today();document.getElementById('dt').value=today();document.getElementById('dcust').value='';document.getElementById('ditem').value='';rDaily();}
function rDaily(){
  var f=document.getElementById('df').value,t=document.getElementById('dt').value,cust=document.getElementById('dcust').value,item=document.getElementById('ditem').value;
  if(!f)f=today();if(!t)t=today();if(f>t){var tmp=f;f=t;t=tmp;}
  var res=document.getElementById('dRes');var h='';
  var purch=[],sales=[],pre=[],dep=[],cars=[],loans=[],exps=[];

function exportCSV(){var f=document.getElementById('df').value,t=document.getElementById('dt').value;if(f>t){var tmp=f;f=t;t=tmp;}var rows=[['Type','Date','Customer','Item','Weight','Price','Amount','Driver','CarFee','Note']];function push(type,date,person,items,amount,driver,carFee,note){for(var i=0;i<items.length;i++)rows.push([type,date,person,items[i].item,items[i].w,items[i].price,N(items[i].w)*N(items[i].price),driver||'',carFee||0,note||'']);}for(var i=0;i<db.purchases.length;i++){var x=db.purchases[i];if(x.date<f||x.date>t)continue;push('အဝယ်',x.date,x.person,x.items,x.total,x.driverName,x.carFee,x.note);}for(var i=0;i<db.sales.length;i++){var x=db.sales[i];if(x.date<f||x.date>t)continue;push('အရောင်း',x.date,x.person,x.items,x.total,'',0,x.note);}for(var i=0;i<db.precuts.length;i++){var x=db.precuts[i];if(x.date<f||x.date>t)continue;push('ကြိုဖြတ်',x.date,x.person,x.items,x.total,x.driverName,x.carFee,x.note);}var csv='\ufeff';for(var i=0;i<rows.length;i++){for(var j=0;j<rows[i].length;j++){var v=String(rows[i][j]==null?'':rows[i][j]).replace(/"/g,'""');csv+='"'+v+'"';if(j<rows[i].length-1)csv+=',';}csv+='\n';}var u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));var a=document.createElement('a');a.href=u;a.download='ptt_'+f+'_'+t+'.csv';document.body.appendChild(a);a.click();a.remove();}

function expData(){var u=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));var a=document.createElement('a');a.href=u;a.download='ptt_'+today()+'.json';document.body.appendChild(a);a.click();a.remove();}
function impData(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){try{var i=JSON.parse(e.target.result);if(confirm('အစားထိုးမှာ?')){db=i;save();location.reload();}}catch(err){alert('❌');}};r.readAsText(f);}

function applyTheme(){var t=localStorage.getItem(TH)||'light';if(t==='dark')document.body.classList.add('dk');var b=document.getElementById('themeBtn');if(b)b.innerText=t==='dark'?'☀️':'🌙';}
function tglTheme(){var t=localStorage.getItem(TH)==='dark'?'light':'dark';localStorage.setItem(TH,t);applyTheme();}

applyTheme();
render(curP());
