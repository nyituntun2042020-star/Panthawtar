<!doctype html>
<html lang="my"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ပန်းသော်တာ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f4f7f6;color:#182321;font-size:15px}
header{position:sticky;top:0;z-index:20;background:#0f766e;color:#fff;padding:10px 13px}
header b{font-size:16px}
.nav{position:sticky;top:40px;background:#fff;display:flex;gap:5px;overflow-x:auto;padding:6px;border-bottom:1px solid #ddd}
.nav button{white-space:nowrap;font-size:12px;padding:6px 9px;background:#e8efee;color:#0f766e;border:0;border-radius:7px;font-weight:600}
.wrap{max-width:1100px;margin:auto;padding:10px 12px 80px}
.cd{background:#fff;border-radius:10px;padding:11px;margin:8px 0;box-shadow:0 1px 4px #0001}
.st{font-size:17px;font-weight:800}.mt{color:#667;font-size:12px}
label{display:block;font-weight:600;margin:6px 0 3px;font-size:13px}
input,select{width:100%;padding:9px;border:1px solid #ccd5d3;border-radius:7px;font-size:15px;background:#fff}
button{border:0;border-radius:7px;padding:8px 11px;background:#0f766e;color:#fff;font-weight:600;cursor:pointer;font-size:13px}
.sf{background:#e8efee;color:#0f766e}.dg{background:#b42318}.sm{padding:4px 8px;font-size:11px}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{padding:6px;border-bottom:1px solid #e0e5e4;text-align:left;font-size:12px}
.ep{text-align:center;color:#667;padding:15px}.ps{color:#087443}.ng{color:#b42318}
.rc{border-top:1px solid #e0e5e4;padding:8px 0}
.itR,.bgR{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap;background:#e8efee;padding:6px;border-radius:7px}
.itR select,.bgR select{flex:2;min-width:80px}.itR input,.bgR input{flex:1;min-width:50px}
.tot{background:#e8efee;padding:9px;border-radius:7px;margin-top:6px;font-size:12px}
.tot div{display:flex;justify-content:space-between;padding:2px 0}
.tot .net{font-size:14px;font-weight:800;border-top:1px solid #e0e5e4;padding-top:5px;margin-top:3px;color:#087443}
.md{position:fixed;inset:0;background:#000c;z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
.md .bx{background:#fff;border-radius:11px;max-width:600px;width:100%;max-height:92vh;overflow:auto;padding:14px}
.cl{float:right;background:#444}
</style></head><body>
<header><b>🌿 ပန်းသော်တာ</b></header>
<div class="nav" id="nav"></div>
<main class="wrap" id="app"></main>
<div id="modal"></div>
<script>
const K='ptt_v1',app=document.getElementById('app'),mod=document.getElementById('modal');
const N=x=>Number(x)||0,money=x=>N(x).toLocaleString('en-US',{maximumFractionDigits:2})+' ကျပ်',qty=x=>N(x).toLocaleString('en-US',{maximumFractionDigits:2});
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>Date.now()+Math.random(),sum=(a,k)=>(a||[]).reduce((z,x)=>z+N(x[k]),0);
const DEF={items:['ဖာလာ','ဘောဖာလာ','ဂေဂေါဖာလာ'],customers:[],purchases:[],sales:[],cars:[]};
let db={...DEF};
try{const s=localStorage.getItem(K);if(s)db=JSON.parse(s)}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Storage ပြည့်')}}

function findC(n){return db.customers.find(c=>c.name===n)}
function addC(n){n=String(n||'').trim();if(n&&!findC(n)){db.customers.push({name:n,phone:''});save()}}
function opts(s=''){return db.items.map(i=>`<option ${i===s?'selected':''}>${esc(i)}</option>`).join('')}
function itemStock(item){let a=0,b=0;db.purchases.forEach(p=>(p.items||[]).forEach(i=>{if(i.item===item)a+=N(i.w)}));db.sales.forEach(p=>(p.items||[]).forEach(i=>{if(i.item===item)b+=N(i.w)}));return a-b}
function itemsBrief(items){return (items||[]).map(i=>i.item).join('+')||'-'}
function cBal(name){const ss=db.sales.filter(s=>s.person===name),ps=db.purchases.filter(p=>p.person===name);
  const st=ss.reduce((z,s)=>z+N(s.total),0),pt=ps.reduce((z,p)=>z+N(p.total),0);return {st,pt,net:st-pt}}
function carWeight(c){return (c.items||[]).reduce((z,i)=>z+N(i.bags)*N(i.wpb),0)}
function carFee(c){return N(c.carRate)*carWeight(c)}
function pendingFor(person){const m={};
  db.sales.filter(s=>s.person===person).forEach(s=>(s.items||[]).forEach(i=>{if(!m[i.item])m[i.item]={item:i.item,sold:0,loaded:0};m[i.item].sold+=N(i.w)}));
  db.cars.filter(c=>c.person===person).forEach(c=>(c.items||[]).forEach(i=>{if(!m[i.item])m[i.item]={item:i.item,sold:0,loaded:0};m[i.item].loaded+=N(i.bags)*N(i.wpb)}));
  return Object.values(m).map(r=>({...r,pending:r.sold-r.loaded})).filter(r=>r.pending>0.001)}
function allPending(){const m={};
  db.sales.forEach(s=>(s.items||[]).forEach(i=>{if(!m[s.person])m[s.person]={person:s.person,items:{}};if(!m[s.person].items[i.item])m[s.person].items[i.item]={sold:0,loaded:0};m[s.person].items[i.item].sold+=N(i.w)}));
  db.cars.forEach(c=>(c.items||[]).forEach(i=>{if(!m[c.person])m[c.person]={person:c.person,items:{}};if(!m[c.person].items[i.item])m[c.person].items[i.item]={sold:0,loaded:0};m[c.person].items[i.item].loaded+=N(i.bags)*N(i.wpb)}));
  const r=[];Object.values(m).forEach(p=>{const it=[];Object.entries(p.items).forEach(([k,v])=>{const pd=v.sold-v.loaded;if(pd>0.001)it.push({item:k,pending:pd})});if(it.length)r.push({person:p.person,items:it})});return r}

/* Multi-item */
function addIt(px,item='',w='',price=''){
  const b=document.getElementById(px+'_items');if(!b)return;
  const d=document.createElement('div');d.className='itR';
  d.innerHTML=`<select class="itS">${opts(item)}</select><input class="itW" type="number" step="any" placeholder="ပိဿာ" value="${w}" oninput="recalc('${px}')"><input class="itP" type="number" step="any" placeholder="ဈေး" value="${price}" oninput="recalc('${px}')"><button class="dg sm" type="button" onclick="this.parentElement.remove();recalc('${px}')">×</button>`;
  b.appendChild(d);recalc(px)}
function colIt(px){const b=document.getElementById(px+'_items');if(!b)return[];const a=[];
  b.querySelectorAll('.itR').forEach(r=>{const item=r.querySelector('.itS').value,w=N(r.querySelector('.itW').value),price=N(r.querySelector('.itP').value);
  if(item&&w>0)a.push({item,w,price})});return a}
function recalc(px){const items=colIt(px);const gross=items.reduce((s,i)=>s+i.w*i.price,0);
  const rate=N(document.getElementById(px+'_carRate')?.value);const fl=items.reduce((s,i)=>s+Math.floor(N(i.w)),0);const fee=rate*fl;
  const g=document.getElementById(px+'_gross'),f=document.getElementById(px+'_fee'),n=document.getElementById(px+'_net'),fe=document.getElementById(px+'_floors'),wt=document.getElementById(px+'_weight');
  if(g)g.textContent=money(gross);if(wt)wt.textContent=qty(items.reduce((s,i)=>s+N(i.w),0))+' ပိဿာ';if(fe)fe.textContent=fl;if(f)f.textContent=money(fee);if(n)n.textContent=money(gross-fee)}

/* Car bags */
function addBg(px,item='',bags='',wpb=''){
  const b=document.getElementById(px+'_bags');if(!b)return;
  const d=document.createElement('div');d.className='bgR';
  d.innerHTML=`<select class="bgS">${opts(item)}</select><input class="bgB" type="number" step="any" placeholder="အိတ်ရေ" value="${bags}" oninput="recalcCar('${px}')"><input class="bgW" type="number" step="any" placeholder="1အိတ်/ပိဿာ" value="${wpb}" oninput="recalcCar('${px}')"><button class="dg sm" type="button" onclick="this.parentElement.remove();recalcCar('${px}')">×</button>`;
  b.appendChild(d);recalcCar(px)}
function colBg(px){const b=document.getElementById(px+'_bags');if(!b)return[];const a=[];
  b.querySelectorAll('.bgR').forEach(r=>{const item=r.querySelector('.bgS').value,bags=N(r.querySelector('.bgB').value),wpb=N(r.querySelector('.bgW').value);
  if(item&&bags>0&&wpb>0)a.push({item,bags,wpb})});return a}
function recalcCar(px){const items=colBg(px);const tw=items.reduce((s,i)=>s+N(i.bags)*N(i.wpb),0);
  const rate=N(document.getElementById(px+'_carRate')?.value);
  const w=document.getElementById(px+'_carWeight'),f=document.getElementById(px+'_carFee');
  if(w)w.textContent=qty(tw)+' ပိဿာ';if(f)f.textContent=money(rate*tw)}

function curP(){return location.hash.slice(1)||'home'}
function go(p){location.hash=p}
function render(p){
  const list=[['home','🏠'],['purchase','📥 အဝယ်'],['sale','📤 အရောင်း'],['car','🚛 ကားတင်'],['customers','👥 ဖောက်သည်'],['stock','📦 Stock'],['settings','⚙️']];
  document.getElementById('nav').innerHTML=list.map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join('');
  if(p.startsWith('customer/')){custDetail(decodeURIComponent(p.slice(9)));return}
  ({home,purchase,sale,car,customers,stock,settings}[p]||home)()}
function shell(t,b){app.innerHTML=`<h2 style="margin:5px 0 8px;font-size:18px">${t}</h2>${b}`}
window.addEventListener('hashchange',()=>render(curP()));

function home(){
  const rev=db.sales.reduce((z,x)=>z+N(x.total),0),cog=db.purchases.reduce((z,x)=>z+N(x.total),0);
  const pend=allPending();
  shell('🏠 Dashboard',`<div class="row">
    <div class="cd">အရောင်း<br><b class="st ps">${money(rev)}</b></div>
    <div class="cd">အဝယ်<br><b class="st">${money(cog)}</b></div>
    <div class="cd">အမြတ်<br><b class="st ${rev-cog>=0?'ps':'ng'}">${money(rev-cog)}</b></div></div>
    <div class="cd"><h3>📦 Stock</h3><table class="tbl"><tr><th>ပစ္စည်း</th><th>ပိဿာ</th></tr>
    ${db.items.map(k=>`<tr><td>${esc(k)}</td><td><b>${qty(itemStock(k))}</b></td></tr>`).join('')}</table></div>
    ${pend.length?`<div class="cd"><h3>🚛 ကားတင်ရန် ကျန်</h3>${pend.slice(0,5).map(p=>`<div class="rc"><div><b>${esc(p.person)}</b></div><div class="mt">${p.items.map(i=>esc(i.item)+': '+qty(i.pending)+' ပိဿာ').join(' · ')}</div></div>`).join('')}</div>`:''}`)}

function entryForm(px,kind,title){
  const isSale=kind==='sale';
  return `<div class="cd"><h3>${title}</h3>
  <div class="row"><label>ရက်စွဲ <input id="${px}_date" type="date" value="${today()}"></label><label>Customer <input id="${px}_person" list="${px}L"><datalist id="${px}L">${db.customers.map(c=>`<option value="${esc(c.name)}"></option>`).join('')}</datalist></label></div>
  ${!isSale?`<div class="row"><label>ကားဆရာ <input id="${px}_driver"></label><label>ကားခ rate <input id="${px}_carRate" type="number" step="any" value="0" oninput="recalc('${px}')"></label></div>`:''}
  <label>📦 ပစ္စည်းများ</label><div id="${px}_items"></div>
  <button class="sf sm" type="button" onclick="addIt('${px}')">➕ ထည့်</button>
  <div class="tot"><div><span>အလေးချိန်:</span><b id="${px}_weight">0</b></div><div><span>Gross:</span><b id="${px}_gross">0</b></div>${!isSale?`<div><span>ကားခ:</span><b id="${px}_fee">0</b></div><div class="net"><span>Net:</span><b id="${px}_net">0</b></div>`:''}</div>
  <label>မှတ်ချက် <input id="${px}_note"></label>
  <button onclick="saveEntry('${px}','${kind}')">💾 သိမ်း</button></div>`}

function saveEntry(px,kind){
  const items=colIt(px);if(!items.length)return alert('ပစ္စည်း');
  const person=document.getElementById(px+'_person').value.trim();if(!person)return alert('Customer');
  const isSale=kind==='sale';const an={purchase:'purchases',sale:'sales'}[kind];
  addC(person);
  const rec={id:uid(),date:document.getElementById(px+'_date').value,person,items,note:document.getElementById(px+'_note').value};
  if(!isSale){rec.driverName=document.getElementById(px+'_driver').value.trim();rec.carRate=N(document.getElementById(px+'_carRate').value);
    rec.carFee=rec.carRate*items.reduce((s,i)=>s+Math.floor(N(i.w)),0)}
  rec.grossAmount=items.reduce((s,i)=>s+i.w*i.price,0);
  rec.total=rec.grossAmount-(isSale?0:N(rec.carFee));
  db[an].push(rec);save();alert('✅');render(kind)}

function txList(kind,list){
  if(!list.length)return '<div class="ep">မရှိ</div>';
  return [...list].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,30).map(x=>{
    const its=(x.items||[]).map(i=>`<div style="margin-left:10px">• ${esc(i.item)} · ${qty(i.w)}×${money(i.price)} = ${money(i.w*i.price)}</div>`).join('');
    const car=kind!=='sale'&&(N(x.carFee)>0||x.driverName)?`<div class="mt">🚛 ${esc(x.driverName||'')} · ကားခ ${money(x.carFee)}</div>`:'';
    const lbl=kind==='purchase'?'အဝယ်':'အရောင်း';
    return `<div class="rc"><div><b>${lbl}</b> ${esc(x.person)} · ${esc(x.date)}</div>${its}${car}<div><b>Total: ${money(N(x.total))}</b></div><div class="row" style="margin-top:4px"><button class="dg sm" onclick="delTx('${({purchase:'purchases',sale:'sales'})[kind]}',${x.id})">🗑️</button></div></div>`}).join('')}
function delTx(t,id){if(!confirm('ဖျက်မှာ?'))return;db[t]=db[t].filter(x=>x.id!==id);save();render(curP())}

function purchase(){shell('📥 အဝယ်',`${entryForm('p','purchase','အဝယ်အသစ်')}
  <div class="cd"><h3>📋 (${db.purchases.length})</h3>${txList('purchase',db.purchases)}</div>`);addIt('p')}
function sale(){shell('📤 အရောင်း',`${entryForm('s','sale','အရောင်းအသစ်')}
  <div class="cd"><h3>📋 (${db.sales.length})</h3>${txList('sale',db.sales)}</div>`);addIt('s')}

function car(){
  const pend=allPending();
  const list=[...db.cars].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  shell('🚛 ကားတင်',`<div class="cd"><h3>ကားတင်အသစ်</h3>
  <div class="row"><label>ရက်စွဲ <input id="c_date" type="date" value="${today()}"></label><label>Customer <input id="c_person" list="cL" oninput="showPend()"><datalist id="cL">${db.customers.map(c=>`<option value="${esc(c.name)}"></option>`).join('')}</datalist></label></div>
  <div id="pendBox" class="cd" style="display:none;background:#e8efee"></div>
  <div class="row"><label>ကားနံပါတ် <input id="c_carNo"></label><label>ကားဆရာ <input id="c_driver"></label></div>
  <div class="row"><label>ဖုန်း <input id="c_driverPhone"></label></div>
  <label>📦 ကုန်များ</label><div id="c_bags"></div>
  <button class="sf sm" type="button" onclick="addBg('c')">➕ ထည့်</button>
  <div class="row"><label>ကားခ rate <input id="c_carRate" type="number" step="any" value="0" oninput="recalcCar('c')"></label></div>
  <div class="tot"><div><span>Total ကုန်ချိန်:</span><b id="c_carWeight">0</b></div><div class="net"><span>ကားခ:</span><b id="c_carFee">0</b></div></div>
  <label>ပို့ရမယ့်နေရာ <input id="c_deliverTo"></label>
  <button onclick="saveCar()">💾 သိမ်း</button></div>
  ${pend.length?`<div class="cd"><h3>⏳ ကားတင်ရန် ကျန် (${pend.length})</h3>${pend.map(p=>`<div class="rc"><div><b>${esc(p.person)}</b></div>${p.items.map(i=>`<div class="mt">• ${esc(i.item)} — ကျန် <b>${qty(i.pending)} ပိဿာ</b></div>`).join('')}<button class="sf sm" style="margin-top:4px" onclick="pref('${esc(p.person).replace(/'/g,"\\'")}')">🚛 တင်မည်</button></div>`).join('')}</div>`:''}
  <div class="cd"><h3>📋 ကားတင်မှတ်တမ်း (${list.length})</h3>
  ${list.length?list.map(c=>{const tw=carWeight(c);return `<div class="rc"><div><b>${esc(c.person)}</b> · ${esc(c.date)}${c.carNo?' · '+esc(c.carNo):''}</div><div class="mt">${esc(c.driverName||'')} · ${esc(c.driverPhone||'')}</div>${(c.items||[]).map(i=>`<div style="margin-left:10px">• ${esc(i.item)} · ${qty(i.bags)}အိတ် × ${qty(i.wpb)} = <b>${qty(i.bags*i.wpb)}</b></div>`).join('')}<div class="mt">Total: <b>${qty(tw)}ပိဿာ</b></div><div><b>ကားခ: ${money(carFee(c))}</b></div>${c.deliverTo?`<div class="mt">📍 ${esc(c.deliverTo)}</div>`:''}<button class="dg sm" onclick="delTx('cars',${c.id})">🗑️</button></div>`}).join(''):'<div class="ep">မရှိ</div>'}
  </div>`);addBg('c')}
function showPend(){const p=document.getElementById('c_person')?.value.trim();const b=document.getElementById('pendBox');if(!b)return;
  if(!p){b.style.display='none';return}
  const items=pendingFor(p);
  if(!items.length){b.style.display='block';b.innerHTML=`⚠️ ${esc(p)} အတွက် ကျန်ကုန် မရှိ`;return}
  b.style.display='block';b.innerHTML=`<b>⏳ ကျန်ကုန်:</b><br>${items.map(i=>`• ${esc(i.item)} — <b>${qty(i.pending)} ပိဿာ</b>`).join('<br>')}`}
function pref(p){const el=document.getElementById('c_person');if(el){el.value=p;showPend();window.scrollTo({top:0,behavior:'smooth'})}}
function saveCar(){const person=document.getElementById('c_person').value.trim();if(!person)return alert('Customer');
  const items=colBg('c');if(!items.length)return alert('ကုန်');
  addC(person);
  db.cars.push({id:uid(),date:document.getElementById('c_date').value,person,carNo:document.getElementById('c_carNo').value.trim(),driverName:document.getElementById('c_driver').value.trim(),driverPhone:document.getElementById('c_driverPhone').value.trim(),items,carRate:N(document.getElementById('c_carRate').value),deliverTo:document.getElementById('c_deliverTo').value});
  save();alert('✅');car()}

function customers(){
  const list=db.customers.map(c=>({name:c.name,...cBal(c.name)})).sort((a,b)=>Math.abs(b.net)-Math.abs(a.net));
  window._cc=list;
  shell('👥 ဖောက်သည်',`<div class="cd"><div class="row"><input id="cq" placeholder="🔍" oninput="filtC()"></div><div class="row"><input id="cnew" placeholder="အသစ်"><button onclick="quickC()">➕</button></div></div><div class="cd" id="cList">${rowC(list)}</div>`)}
function rowC(l){return l.length?l.map(c=>`<div class="rc" style="cursor:pointer" onclick="go('customer/${encodeURIComponent(c.name)}')"><div style="display:flex;justify-content:space-between"><div><b>${esc(c.name)}</b><div class="mt">အရောင်း ${money(c.st)} · အဝယ် ${money(c.pt)}</div></div><div style="font-weight:800" class="${c.net>0?'ng':(c.net<0?'ps':'')}">${c.net>0?money(c.net)+' ပေး':(c.net<0?money(-c.net)+' ရ':'ရှင်း')}</div></div></div>`).join(''):'<div class="ep">မရှိ</div>'}
function filtC(){const q=(document.getElementById('cq').value||'').toLowerCase();document.getElementById('cList').innerHTML=rowC((window._cc||[]).filter(c=>c.name.toLowerCase().includes(q)))}
function quickC(){const n=document.getElementById('cnew').value.trim();if(!n)return;addC(n);customers()}
function custDetail(name){
  const bal=cBal(name);
  const sales=db.sales.filter(s=>s.person===name).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const purchases=db.purchases.filter(p=>p.person===name).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const pend=pendingFor(name);
  app.innerHTML=`<button class="sf" onclick="go('customers')">← ဖောက်သည်</button>
  <h2 style="margin:6px 0">👤 ${esc(name)}</h2>
