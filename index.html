<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ပန်းသော်တာ</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f4f7f6;color:#182321;font-size:15px}
body.dk{background:#0d1117;color:#e6edf3}
header{position:sticky;top:0;z-index:20;background:#0f766e;color:#fff;padding:10px 13px;display:flex;align-items:center;gap:8px}
header b{font-size:16px}
#clk{margin-left:auto;font-size:13px}
.tg{background:rgba(255,255,255,.2);color:#fff;padding:5px 8px;border-radius:8px;border:0;font-size:14px}
.nav{position:sticky;top:44px;z-index:19;background:#fff;display:flex;gap:5px;overflow-x:auto;padding:6px;border-bottom:1px solid #e0e5e4}
body.dk .nav{background:#161b22;border-color:#30363d}
.nav button{white-space:nowrap;font-size:12px;padding:6px 9px;background:#e8efee;color:#0f766e;border:0;border-radius:7px;font-weight:600}
body.dk .nav button{background:#21262d;color:#2dd4bf}
.wrap{max-width:1100px;margin:auto;padding:10px 12px 80px}
.cd{background:#fff;border-radius:10px;padding:11px;margin:8px 0;box-shadow:0 1px 4px #0001}
body.dk .cd{background:#161b22}
.st{font-size:17px;font-weight:800}
.mt{color:#667;font-size:12px}
body.dk .mt{color:#8b949e}
label{display:block;font-weight:600;margin:6px 0 3px;font-size:13px}
input,select{width:100%;padding:9px;border:1px solid #ccd5d3;border-radius:7px;font-size:15px;background:#fff;color:#182321}
body.dk input,body.dk select{background:#0d1117;color:#e6edf3;border-color:#30363d}
button{border:0;border-radius:7px;padding:8px 11px;background:#0f766e;color:#fff;font-weight:600;font-size:13px}
.sf{background:#e8efee;color:#0f766e}
body.dk .sf{background:#21262d;color:#2dd4bf}
.dg{background:#b42318}
.sm{padding:4px 8px;font-size:11px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row>*{flex:1;min-width:110px}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:6px;border-bottom:1px solid #e0e5e4;text-align:left;font-size:12px}
body.dk .tbl th,body.dk .tbl td{border-color:#30363d}
.ep{text-align:center;color:#667;padding:15px}
.ps{color:#087443}.ng{color:#b42318}
.rc{border-top:1px solid #e0e5e4;padding:8px 0}
body.dk .rc{border-color:#30363d}
.itR,.bgR{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap;background:#e8efee;padding:6px;border-radius:7px}
body.dk .itR,body.dk .bgR{background:#21262d}
.itR select,.bgR select{flex:2;min-width:80px}
.itR input,.bgR input{flex:1;min-width:50px}
.tot{background:#e8efee;padding:9px;border-radius:7px;margin-top:6px;font-size:12px}
body.dk .tot{background:#21262d}
.tot div{display:flex;justify-content:space-between;padding:2px 0}
.tot .net{font-size:14px;font-weight:800;border-top:1px solid #e0e5e4;padding-top:5px;margin-top:3px;color:#087443}
.md{position:fixed;inset:0;background:#000c;z-index:50;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.md .bx{background:#fff;border-radius:11px;max-width:600px;width:100%;max-height:92vh;overflow:auto;padding:14px}
body.dk .md .bx{background:#161b22}
.cl{float:right;background:#444}
.th{max-width:70px;max-height:70px;border-radius:6px;display:block;margin:4px 0;cursor:pointer}
.pb{border:1px dashed #ccd5d3;padding:8px;border-radius:8px;margin-top:6px}
body.dk .pb{border-color:#30363d}
.nt{padding:9px;border-radius:8px;background:#e8efee;margin:6px 0;font-size:12px}
body.dk .nt{background:#21262d}
</style>
</head>
<body>
<header><b>🌿 ပန်းသော်တာ</b><button class="tg" id="themeBtn" onclick="tglTheme()">🌙</button><span id="clk"></span></header>
<div class="nav" id="nav"></div>
<main class="wrap" id="app"></main>
<div id="modal"></div>
<script>
var K='ptt_v3',TH='ptt_th',app=document.getElementById('app'),mod=document.getElementById('modal');
var N=function(x){return Number(x)||0;};
var money=function(x){return N(x).toLocaleString('en-US',{maximumFractionDigits:2})+' ကျပ်';};
var qty=function(x){return N(x).toLocaleString('en-US',{maximumFractionDigits:2});};
var today=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});};
var uid=function(){return Date.now()+Math.floor(Math.random()*1000);};
var sum=function(a,k){if(!a)return 0;var t=0;for(var i=0;i<a.length;i++)t+=N(a[i][k]);return t;};
var BANKS=['KBZ','AYA','CB','Wave','Kpay','UAB','Yoma','AGD','အခြား'];
setInterval(function(){var c=document.getElementById('clk');if(c)c.innerText=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});},1000);

var DEF={items:['ဖာလာ','ဘောဖာလာ','ဂေဂေါဖာလာ'],customers:[],purchases:[],sales:[],deposits:[],precuts:[],loans:[],cars:[],expenses:[]};
var db={items:DEF.items.slice(),customers:[],purchases:[],sales:[],deposits:[],precuts:[],loans:[],cars:[],expenses:[]};
try{var sv=localStorage.getItem(K);if(sv){var pp=JSON.parse(sv);if(pp&&pp.items)db=pp;}}catch(e){}
try{for(var i=0;i<db.items.length;i++){}for(var i=0;i<db.purchases.length;i++){var x=db.purchases[i];if(!x.items)x.items=x.item?[{item:x.item,w:N(x.w),price:N(x.price),bags:N(x.bags)}]:[];x.total=N(x.total)||x.items.reduce(function(s,it){return s+N(it.w)*N(it.price);},0);x.payments=x.payments||[];x.photo=x.photo||'';x.driverName=x.driverName||'';x.carRate=N(x.carRate);x.carFee=N(x.carFee);x.note=x.note||'';}for(var i=0;i<db.sales.length;i++){var x=db.sales[i];if(!x.items)x.items=x.item?[{item:x.item,w:N(x.w),price:N(x.price)}]:[];x.total=N(x.total)||x.items.reduce(function(s,it){return s+N(it.w)*N(it.price);},0);x.payments=x.payments||[];x.photo=x.photo||'';x.note=x.note||'';}for(var i=0;i<db.cars.length;i++){var c=db.cars[i];if(!c.items)c.items=[];c.carRate=N(c.carRate);c.driverName=c.driverName||'';c.driverPhone=c.driverPhone||'';c.deliverTo=c.deliverTo||'';}for(var i=0;i<db.deposits.length;i++){var d=db.deposits[i];if(!d.items)d.items=[];d.fixes=d.fixes||[];}for(var i=0;i<db.precuts.length;i++){var p=db.precuts[i];if(!p.items)p.items=[];p.deliveries=p.deliveries||[];}for(var i=0;i<db.loans.length;i++){db.loans[i].payments=db.loans[i].payments||[];}}catch(e){}

function save(){try{localStorage.setItem(K,JSON.stringify(db));return true;}catch(e){alert('Storage ပြည့်နေပါ');return false;}}

function findC(n){for(var i=0;i<db.customers.length;i++)if(db.customers[i].name===n)return db.customers[i];return null;}
function addC(n,p){n=String(n||'').trim();if(!n)return;if(!findC(n)){db.customers.push({name:n,phone:p||'',address:''});save();}}
function cList(){var s='';for(var i=0;i<db.customers.length;i++)s+='<option value="'+esc(db.customers[i].name)+'"></option>';return s;}
function cBal(name){var st=0,sp=0,pt=0,pp=0;for(var i=0;i<db.sales.length;i++){if(db.sales[i].person===name){st+=N(db.sales[i].total);sp+=sum(db.sales[i].payments,'amount');}}for(var i=0;i<db.purchases.length;i++){if(db.purchases[i].person===name){pt+=N(db.purchases[i].total);pp+=sum(db.purchases[i].payments,'amount');}}return {st:st,sp:sp,pt:pt,pp:pp,they:st-sp,we:pt-pp,net:(st-sp)-(pt-pp)};}
function opts(sel){sel=sel||'';var h='';for(var i=0;i<db.items.length;i++){var it=db.items[i];h+='<option'+(it===sel?' selected':'')+'>'+esc(it)+'</option>';}return h;}
function brief(items){if(!items||!items.length)return '-';var a=[];for(var i=0;i<items.length;i++)a.push(items[i].item);return a.join('+');}
function stock(item){var a=0,b=0;for(var i=0;i<db.purchases.length;i++){var p=db.purchases[i];for(var j=0;j<p.items.length;j++)if(p.items[j].item===item)a+=N(p.items[j].w);}for(var i=0;i<db.precuts.length;i++){var p=db.precuts[i];for(var j=0;j<p.items.length;j++)if(p.items[j].item===item)a+=N(p.items[j].w);}for(var i=0;i<db.deposits.length;i++){var d=db.deposits[i];for(var j=0;j<(d.fixes||[]).length;j++)if(d.fixes[j].item===item)a+=N(d.fixes[j].w);}for(var i=0;i<db.sales.length;i++){var s=db.sales[i];for(var j=0;j<s.items.length;j++)if(s.items[j].item===item)b+=N(s.items[j].w);}return a-b;}
function itemBought(item){var a=0;for(var i=0;i<db.purchases.length;i++){var p=db.purchases[i];for(var j=0;j<p.items.length;j++)if(p.items[j].item===item)a+=N(p.items[j].w);}for(var i=0;i<db.precuts.length;i++){var p=db.precuts[i];for(var j=0;j<p.items.length;j++)if(p.items[j].item===item)a+=N(p.items[j].w);}for(var i=0;i<db.deposits.length;i++){var d=db.deposits[i];for(var j=0;j<(d.fixes||[]).length;j++)if(d.fixes[j].item===item)a+=N(d.fixes[j].w);}return a;}
function itemSold(item){var b=0;for(var i=0;i<db.sales.length;i++){var s=db.sales[i];for(var j=0;j<s.items.length;j++)if(s.items[j].item===item)b+=N(s.items[j].w);}return b;}
function avgBuy(item){var w=0,v=0;for(var i=0;i<db.purchases.length;i++){var p=db.purchases[i];for(var j=0;j<p.items.length;j++)if(p.items[j].item===item){w+=N(p.items[j].w);v+=N(p.items[j].w)*N(p.items[j].price);}}for(var i=0;i<db.precuts.length;i++){var p=db.precuts[i];for(var j=0;j<p.items.length;j++)if(p.items[j].item===item){w+=N(p.items[j].w);v+=N(p.items[j].w)*N(p.items[j].price);}}for(var i=0;i<db.deposits.length;i++){var d=db.deposits[i];for(var j=0;j<(d.fixes||[]).length;j++){var f=d.fixes[j];if(f.item===item){w+=N(f.w);v+=N(f.w)*N(f.price);}}}return w>0?v/w:0;}
function avgSell(item){var w=0,v=0;for(var i=0;i<db.sales.length;i++){var s=db.sales[i];for(var j=0;j<s.items.length;j++)if(s.items[j].item===item){w+=N(s.items[j].w);v+=N(s.items[j].w)*N(s.items[j].price);}}return w>0?v/w:0;}
function purchaseCost(){var t=0;for(var i=0;i<db.purchases.length;i++)t+=N(db.purchases[i].total);for(var i=0;i<db.precuts.length;i++)t+=N(db.precuts[i].total);for(var i=0;i<db.deposits.length;i++){var d=db.deposits[i];for(var j=0;j<(d.fixes||[]).length;j++)t+=N(d.fixes[j].w)*N(d.fixes[j].price);}return t;}
function saleAll(){var t=0;for(var i=0;i<db.sales.length;i++)t+=N(db.sales[i].total);return t;}
function expAll(){var t=0;for(var i=0;i<db.expenses.length;i++)t+=N(db.expenses[i].amount);return t;}
function topBuy(){var m={};function add(p,i,w,a){if(!p||!i)return;var k=p+'|'+i;if(!m[k])m[k]={person:p,item:i,w:0,amount:0};m[k].w+=N(w);m[k].amount+=N(a);}for(var i=0;i<db.purchases.length;i++){var e=db.purchases[i];for(var j=0;j<e.items.length;j++){var it=e.items[j];add(e.person,it.item,it.w,N(it.w)*N(it.price));}}for(var i=0;i<db.precuts.length;i++){var e=db.precuts[i];for(var j=0;j<e.items.length;j++){var it=e.items[j];add(e.person,it.item,it.w,N(it.w)*N(it.price));}}for(var i=0;i<db.deposits.length;i++){var e=db.deposits[i];for(var j=0;j<(e.fixes||[]).length;j++){var f=e.fixes[j];add(e.person,f.item,f.w,N(f.w)*N(f.price));}}var r=[];for(var k in m){var v=m[k];v.avg=v.w>0?v.amount/v.w:0;r.push(v);}r.sort(function(a,b){return b.amount-a.amount;});return r.slice(0,20);}
function topSale(){var m={};for(var i=0;i<db.sales.length;i++){var e=db.sales[i];for(var j=0;j<e.items.length;j++){var it=e.items[j];if(!e.person||!it.item)continue;var k=e.person+'|'+it.item;if(!m[k])m[k]={person:e.person,item:it.item,w:0,amount:0};m[k].w+=N(it.w);m[k].amount+=N(it.w)*N(it.price);}}var r=[];for(var k in m){var v=m[k];v.avg=v.w>0?v.amount/v.w:0;r.push(v);}r.sort(function(a,b){return b.amount-a.amount;});return r.slice(0,20);}
function carWeight(c){var t=0;if(c.items)for(var i=0;i<c.items.length;i++)t+=N(c.items[i].bags)*N(c.items[i].wpb);return t;}
function carFee(c){return Math.floor(N(c.carRate))*carWeight(c);}
function pendingFor(p){var m={};for(var i=0;i<db.sales.length;i++){var s=db.sales[i];if(s.person===p)for(var j=0;j<s.items.length;j++){var it=s.items[j];if(!m[it.item])m[it.item]={item:it.item,sold:0,loaded:0};m[it.item].sold+=N(it.w);}}for(var i=0;i<db.cars.length;i++){var c=db.cars[i];if(c.person===p)for(var j=0;j<c.items.length;j++){var it=c.items[j];if(!m[it.item])m[it.item]={item:it.item,sold:0,loaded:0};m[it.item].loaded+=N(it.bags)*N(it.wpb);}}var r=[];for(var k in m){var v=m[k];v.pending=v.sold-v.loaded;if(v.pending>0.001)r.push(v);}return r;}
function allPending(){var m={};for(var i=0;i<db.sales.length;i++){var s=db.sales[i];for(var j=0;j<s.items.length;j++){var it=s.items[j];if(!m[s.person])m[s.person]={person:s.person,items:{}};if(!m[s.person].items[it.item])m[s.person].items[it.item]={sold:0,loaded:0};m[s.person].items[it.item].sold+=N(it.w);}}for(var i=0;i<db.cars.length;i++){var c=db.cars[i];for(var j=0;j<c.items.length;j++){var it=c.items[j];if(!m[c.person])m[c.person]={person:c.person,items:{}};if(!m[c.person].items[it.item])m[c.person].items[it.item]={sold:0,loaded:0};m[c.person].items[it.item].loaded+=N(it.bags)*N(it.wpb);}}var r=[];for(var p in m){var o=m[p];var arr=[];for(var k in o.items){var v=o.items[k];var pd=v.sold-v.loaded;if(pd>0.001)arr.push({item:k,pending:pd});}if(arr.length)r.push({person:p,items:arr});}return r;}

function addIt(px,item,w,price,bags,wb){wb=wb||false;item=item||'';w=w||'';price=price||'';bags=bags||'';var b=document.getElementById(px+'_items');if(!b)return;var d=document.createElement('div');d.className='itR';d.innerHTML='<select class="itS">'+opts(item)+'</select><input class="itW" type="number" step="any" placeholder="ပိဿာ" value="'+w+'" oninput="recalc(\''+px+'\')"><input class="itP" type="number" step="any" placeholder="ဈေး" value="'+price+'" oninput="recalc(\''+px+'\')">'+(wb?'<input class="itB" type="number" step="any" placeholder="အိတ်" value="'+bags+'">':'')+'<button class="dg sm" type="button" onclick="this.parentElement.remove();recalc(\''+px+'\')">×</button>';b.appendChild(d);recalc(px);}
function colIt(px,wb){wb=wb||false;var b=document.getElementById(px+'_items');if(!b)return[];var rows=b.querySelectorAll('.itR');var a=[];for(var i=0;i<rows.length;i++){var r=rows[i];var item=r.querySelector('.itS').value;var w=N(r.querySelector('.itW').value);var price=N(r.querySelector('.itP').value);var bE=r.querySelector('.itB');var bags=bE?N(bE.value):0;if(item&&(w>0||bags>0))a.push({item:item,w:w,price:price,bags:bags});}return a;}
function recalc(px){var items=colIt(px);var gross=0;for(var i=0;i<items.length;i++)gross+=items[i].w*items[i].price;var re=document.getElementById(px+'_carRate');var rate=re?N(re.value):0;var fl=0;for(var i=0;i<items.length;i++)fl+=Math.floor(N(items[i].w));var fee=rate*fl;var tw=0;for(var i=0;i<items.length;i++)tw+=N(items[i].w);var g=document.getElementById(px+'_gross');if(g)g.textContent=money(gross);var wt=document.getElementById(px+'_weight');if(wt)wt.textContent=qty(tw)+' ပိဿာ';var fe=document.getElementById(px+'_floors');if(fe)fe.textContent=fl;var f=document.getElementById(px+'_fee');if(f)f.textContent=money(fee);var n=document.getElementById(px+'_net');if(n)n.textContent=money(gross-fee);}
function addBg(px,item,bags,wpb){item=item||'';bags=bags||'';wpb=wpb||'';var b=document.getElementById(px+'_bags');if(!b)return;var d=document.createElement('div');d.className='bgR';d.innerHTML='<select class="bgS">'+opts(item)+'</select><input class="bgB" type="number" step="any" placeholder="အိတ်ရေ" value="'+bags+'" oninput="recalcCar(\''+px+'\')"><input class="bgW" type="number" step="any" placeholder="1အိတ်/ပိဿာ" value="'+wpb+'" oninput="recalcCar(\''+px+'\')"><button class="dg sm" type="button" onclick="this.parentElement.remove();recalcCar(\''+px+'\')">×</button>';b.appendChild(d);recalcCar(px);}
function colBg(px){var b=document.getElementById(px+'_bags');if(!b)return[];var rows=b.querySelectorAll('.bgR');var a=[];for(var i=0;i<rows.length;i++){var r=rows[i];var item=r.querySelector('.bgS').value;var bags=N(r.querySelector('.bgB').value);var wpb=N(r.querySelector('.bgW').value);if(item&&bags>0&&wpb>0)a.push({item:item,bags:bags,wpb:wpb});}return a;}
function recalcCar(px){var items=colBg(px);var tw=0;for(var i=0;i<items.length;i++)tw+=N(items[i].bags)*N(items[i].wpb);var re=document.getElementById(px+'_carRate');var rate=re?N(re.value):0;var w=document.getElementById(px+'_carWeight');if(w)w.textContent=qty(tw)+' ပိဿာ';var f=document.getElementById(px+'_carFee');if(f)f.textContent=money(Math.floor(rate)*tw);}

function addP(px){readP(px,function(p){alert(p?'✅ ပုံထည့်ပြီ':'')});}
function readP(id,cb){var el=document.getElementById(id);var f=el?el.files[0]:null;if(!f)return cb('');var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var mx=600,sc=Math.min(1,mx/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6));};im.src=r.result;};r.readAsDataURL(f);}
function pv(inp,box){var f=inp.files[0];var el=document.getElementById(box);if(!f){el.innerHTML='';return;}var r=new FileReader();r.onload=function(){el.innerHTML='<img class="th" src="'+r.result+'" onclick="viewImg(this.src)">';};r.readAsDataURL(f);}
function viewImg(s){mod.innerHTML='<div class="md" onclick="closeM()"><div class="bx" onclick="event.stopPropagation()" style="text-align:center"><button class="cl" onclick="closeM()">✕</button><img src="'+s+'" style="max-width:100%;max-height:75vh;border-radius:7px"></div></div>';}
function thumb(p,s){s=s||60;return p?'<img src="'+p+'" class="th" style="max-width:'+s+'px;max-height:'+s+'px" onclick="viewImg(this.src)">':'';}
function closeM(){mod.innerHTML='';}
function pField(id,label){return '<div class="pb"><label>'+(label||'ဓာတ်ပုံ')+'</label><input id="'+id+'" type="file" accept="image/*" capture="environment" onchange="pv(this,\''+id+'p\')"><div id="'+id+'p"></div></div>';}

function shell(t,b){app.innerHTML='<h2 style="margin:5px 0 8px;font-size:18px">'+t+'</h2>'+b;}
function go(p){if(location.hash.slice(1)===p)render(p);else location.hash=p;}
function curP(){var h=location.hash.slice(1);return h||'home';}

window.addEventListener('hashchange',function(){render(curP());});

function home(){var rev=saleAll(),cog=purchaseCost(),ex=expAll();var st='';for(var i=0;i<db.items.length;i++){var k=db.items[i];st+='<tr><td>'+esc(k)+'</td><td><b>'+qty(stock(k))+'</b></td><td>'+money(avgBuy(k))+'</td><td>'+money(avgSell(k))+'</td></tr>';}var pend=allPending();var pdh='';if(pend.length){pdh='<div class="cd"><h3>🚛 ကားတင်ရန် ကျန်</h3>';for(var i=0;i<Math.min(5,pend.length);i++){var p=pend[i];var s='';for(var j=0;j<p.items.length;j++)s+=esc(p.items[j].item)+': '+qty(p.items[j].pending)+' · ';pdh+='<div class="rc"><b>'+esc(p.person)+'</b><div class="mt">'+s+'</div></div>';}pdh+='</div>';}shell('🏠 Dashboard','<div class="row"><div class="cd">အရောင်း<br><b class="st ps">'+money(rev)+'</b></div><div class="cd">အဝယ်<br><b class="st">'+money(cog)+'</b></div><div class="cd">စရိတ်<br><b class="st">'+money(ex)+'</b></div><div class="cd">အမြတ်<br><b class="st '+((rev-cog-ex)>=0?'ps':'ng')+'">'+money(rev-cog-ex)+'</b></div></div><div class="cd"><h3>📦 Stock</h3><table class="tbl"><tr><th>ပစ္စည်း</th><th>ပိဿာ</th><th>Avg ဝယ်</th><th>Avg ရောင်း</th></tr>'+st+'</table></div>'+pdh);}

function entryForm(px,kind,title){var isSale=kind==='sale';return '<div class="cd"><h3>'+title+'</h3><div class="row"><label>ရက်စွဲ <input id="'+px+'_date" type="date" value="'+today()+'"></label><label>Customer <input id="'+px+'_person" list="'+px+'L"><datalist id="'+px+'L">'+cList()+'</datalist></label></div>'+(isSale?'':'<div class="row"><label>ကားဆရာ <input id="'+px+'_driver"></label><label>ကားခ rate <input id="'+px+'_carRate" type="number" step="any" value="0" oninput="recalc(\''+px+'\')"></label></div>')+'<label>📦 ပစ္စည်းများ</label><div id="'+px+'_items"></div><button class="sf sm" type="button" onclick="addIt(\''+px+'\',null,null,null,null,'+(!isSale)+')">➕ ထည့်</button><div class="tot"><div><span>အလေးချိန်:</span><b id="'+px+'_weight">0</b></div><div><span>Gross:</span><b id="'+px+'_gross">0</b></div>'+(isSale?'':'<div><span>ကားခ:</span><b id="'+px+'_fee">0</b></div><div class="net"><span>Net:</span><b id="'+px+'_net">0</b></div>')+'</div><label>မှတ်ချက် <input id="'+px+'_note"></label>'+pField(px+'_photo')+'<br><button onclick="saveEntry(\''+px+'\',\''+kind+'\')">💾 သိမ်း</button></div>';}

function saveEntry(px,kind){var wb=kind!=='sale';var items=colIt(px,wb);if(!items.length)return alert('ပစ္စည်း');var person=document.getElementById(px+'_person').value.trim();if(!person)return alert('Customer');var isSale=kind==='sale';addC(person);var date=document.getElementById(px+'_date').value,note=document.getElementById(px+'_note').value;readP(px+'_photo',function(photo){var rec={id:uid(),date:date,person:person,items:items,note:note,photo:photo,grossAmount:items.reduce(function(s,it){return s+it.w*it.price;},0)};if(!isSale){rec.driverName=document.getElementById(px+'_driver').value.trim();rec.carRate=Math.floor(N(document.getElementById(px+'_carRate').value));var fl=0;for(var i=0;i<items.length;i++)fl+=Math.floor(N(items[i].w));rec.carFee=rec.carRate*fl;}rec.netAmount=rec.grossAmount-(isSale?0:N(rec.carFee));rec.total=rec.netAmount;if(kind==='purchase'){rec.payments=[];db.purchases.push(rec);}else if(kind==='sale'){rec.payments=[];db.sales.push(rec);}else if(kind==='precut'){rec.deliveries=[];db.precuts.push(rec);}else if(kind==='deposit'){rec.fixes=[];db.deposits.push(rec);}save();alert('✅');render(kind);});}

function txList(kind,list){if(!list.length)return '<div class="ep">မရှိ</div>';var sorted=list.slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date));}).slice(0,30);var h='';var coll={purchase:'purchases',sale:'sales',precut:'precuts',deposit:'deposits'}[kind];var lbl={purchase:'အဝယ်',sale:'အရောင်း',precut:'ကြိုဖြတ်',deposit:'အပ်'}[kind];for(var k=0;k<sorted.length;k++){var x=sorted[k];var its='';if(x.items)for(var i=0;i<x.items.length;i++){var it=x.items[i];its+='<div style="margin-left:10px">• '+esc(it.item)+' · '+qty(it.w)+'×'+money(it.price)+' = '+money(it.w*it.price)+(kind!=='sale'&&N(it.bags)>0?' · အိတ် '+qty(it.bags):'')+'</div>';}var car=kind!=='sale'&&(N(x.carFee)>0||x.driverName)?'<div class="mt">🚛 '+(x.driverName?esc(x.driverName)+' · ':'')+'ကားခ '+money(x.carFee)+'</div>':'';h+='<div class="rc"><div><b>'+lbl+'</b> '+esc(x.person)+' · '+esc(x.date)+'</div>'+its+car+'<div><b>Total: '+money(N(x.total))+'</b></div>'+(x.note?'<div class="mt">📝 '+esc(x.note)+'</div>':'')+thumb(x.photo)+'<div class="row" style="margin-top:4px"><button class="sf sm" onclick="openEdit(\''+kind+'\','+x.id+')">✏️</button><button class="dg sm" onclick="delTx(\''+coll+'\','+x.id+')">🗑️</button></div></div>';}return h;}
function delTx(t,id){if(!confirm('ဖျက်မှာ?'))return;var a=[];for(var i=0;i<db[t].length;i++)if(db[t][i].id!==id)a.push(db[t][i]);db[t]=a;save();render(curP());}
function delSub(k,p,id){if(!confirm('ဖျက်မှာ?'))return;if(k==='deposit'){var d=db.deposits.find(function(x){return x.id===p;});if(d)d.fixes=d.fixes.filter(function(f){return f.id!==id;});}else if(k==='precut'){var d=db.precuts.find(function(x){return x.id===p;});if(d)d.deliveries=d.deliveries.filter(function(f){return f.id!==id;});}else if(k==='loan'){var l=db.loans.find(function(x){return x.id===p;});if(l)l.payments=l.payments.filter(function(f){return f.id!==id;});}save();render(curP());}

function purchase(){var t=topBuy();var st='';for(var i=0;i<db.items.length;i++){var it=db.items[i];var b=itemBought(it);if(b>0)st+='<tr><td>'+esc(it)+'</td><td>'+qty(b)+'</td><td><b>'+money(avgBuy(it))+'</b></td></tr>';}var th='';for(var i=0;i<t.length;i++){var x=t[i];th+='<tr><td>'+esc(x.person)+'</td><td>'+esc(x.item)+'</td><td>'+qty(x.w)+'</td><td>'+money(x.avg)+'</td><td><b>'+money(x.amount)+'</b></td></tr>';}shell('📥 အဝယ်',entryForm('p','purchase','အဝယ်အသစ်')+'<div class="cd"><h3>📊 Avg ဝယ်</h3><table class="tbl"><tr><th>ပစ္စည်း</th><th>စုစုပေါင်း</th><th>Avg</th></tr>'+(st||'<tr><td colspan="3" class="ep">မရှိ</td></tr>')+'</table></div><div class="cd"><h3>🏆 Top 20 (နာမည်+Item)</h3><table class="tbl"><tr><th>Customer</th><th>Item</th><th>ပိဿာ</th><th>Avg</th><th>Amount</th></tr>'+(th||'<tr><td colspan="5" class="ep">မရှိ</td></tr>')+'</table></div><div class="cd"><h3>📋 ('+db.purchases.length+')</h3>'+txList('purchase',db.purchases)+'</div>');addIt('p',null,null,null,null,true);}

function sale(){var t=topSale();var th='';for(var i=0;i<t.length;i++){var x=t[i];th+='<tr><td>'+esc(x.person)+'</td><td>'+esc(x.item)+'</td><td>'+qty(x.w)+'</td><td>'+money(x.avg)+'</td><td><b>'+money(x.amount)+'</b></td></tr>';}shell('📤 အရောင်း',entryForm('s','sale','အရောင်းအသစ်')+'<div class="nt">📌 အရောင်း Save တဲ့အခါ ငွေ auto မတင်ပါ။ Customer Detail မှာ "💰" နှိပ်ပါ။</div><div class="cd"><h3>🏆 Top 20 (နာမည်+Item)</h3><table class="tbl"><tr><th>Customer</th><th>Item</th><th>ပိဿာ</th><th>Avg</th><th>Amount</th></tr>'+(th||'<tr><td colspan="5" class="ep">မရှိ</td></tr>')+'</table></div><div class="cd"><h3>📋 ('+db.sales.length+')</h3>'+txList('sale',db.sales)+'</div>');addIt('s',null,null,null,null,false);}

function deposit(){var list=db.deposits.slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date));}).slice(0,30);var h='';for(var k=0;k<list.length;k++){var d=list[k];var its='';for(var i=0;i<d.items.length;i++){var it=d.items[i];its+=esc(it.item)+': '+qty(it.w)+(N(it.bags)>0?' ('+qty(it.bags)+'အိတ်)':'');if(i<d.items.length-1)its+=' · ';}var fixh='';for(var i=0;i<(d.fixes||[]).length;i++){var f=d.fixes[i];fixh+='<div class="mt" style="margin-left:10px">↳ '+esc(f.date)+' · '+esc(f.item)+' · '+qty(f.w)+' × '+money(f.price)+' <button class="dg sm" onclick="delSub(\'deposit\','+d.id+','+f.id+')">×</button></div>';}h+='<div class="rc"><div><b>'+esc(d.person)+'</b> · '+esc(d.date)+'</div><div>'+its+'</div>'+(d.driverName||N(d.carFee)?'<div class="mt">🚛 '+esc(d.driverName||'')+' · ကားခ '+money(d.carFee)+'</div>':'')+'<div><b>Total: '+money(N(d.total))+'</b></div>'+thumb(d.photo)+fixh+'<div class="row" style="margin-top:4px"><button class="sf sm" onclick="addFix('+d.id+')">➕</button><button class="sf sm" onclick="openEdit(\'deposit\','+d.id+')">✏️</button><button class="dg sm" onclick="delTx(\'deposits\','+d.id+')">🗑️</button></div></div>';}shell('📦 ကုန်အပ်',entryForm('d','deposit','ကုန်အပ်အသစ်')+'<div class="cd"><h3>📋 ('+db.deposits.length+')</h3>'+(h||'<div class="ep">မရှိ</div>')+'</div>');addIt('d',null,null,null,null,true);}
function addFix(dId){var d=db.deposits.find(function(x){return x.id===dId;});if(!d)return;var rem={};for(var i=0;i<d.items.length;i++){var it=d.items[i];var fixed=0;for(var j=0;j<(d.fixes||[]).length;j++)if(d.fixes[j].item===it.item)fixed+=N(d.fixes[j].w);rem[it.item]=N(it.w)-fixed;}var avail=[];for(var k in rem)if(rem[k]>0.001)avail.push(k);if(!avail.length)return alert('ထုတ်ပြီး');var item=avail.length===1?avail[0]:prompt('ပစ္စည်း ('+avail.join(',')+')',avail[0]);if(!item||!rem[item])return;var w=prompt('ပိဿာ (ကျန် '+qty(rem[item])+')',rem[item]);if(w===null)return;var wt=N(w);if(wt<=0||wt>rem[item]+0.01)return alert('မှန်ကန်စွာ');var price=prompt('ဈေး','0');if(price===null)return;d.fixes=d.fixes||[];d.fixes.push({id:uid(),date:today(),item:item,w:wt,price:N(price),note:''});save();deposit();}

function precut(){var list=db.precuts.slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date));}).slice(0,30);var h='';for(var k=0;k<list.length;k++){var p=list[k];var its='';for(var i=0;i<p.items.length;i++){var it=p.items[i];its+=esc(it.item)+': '+qty(it.w)+(N(it.bags)>0?' ('+qty(it.bags)+'အိတ်)':'');if(i<p.items.length-1)its+=' · ';}var dvh='';for(var i=0;i<(p.deliveries||[]).length;i++){var v=p.deliveries[i];dvh+='<div class="mt" style="margin-left:10px">↳ '+esc(v.date)+' · '+esc(v.item||'')+' · '+qty(v.w)+' <button class="dg sm" onclick="delSub(\'precut\','+p.id+','+v.id+')">×</button></div>';}h+='<div class="rc"><div><b>'+esc(p.person)+'</b> · '+esc(p.date)+'</div><div>'+its+'</div>'+(p.driverName||N(p.carFee)?'<div class="mt">🚛 '+esc(p.driverName||'')+' · ကားခ '+money(p.carFee)+'</div>':'')+'<div><b>Total: '+money(N(p.total))+'</b></div>'+thumb(p.photo)+dvh+'<div class="row" style="margin-top:4px"><button class="sf sm" onclick="addDel('+p.id+')">➕</button><button class="sf sm" onclick="openEdit(\'precut\','+p.id+')">✏️</button><button class="dg sm" onclick="delTx(\'precuts\','+p.id+')">🗑️</button></div></div>';}shell('✂️ ကြိုဖြတ်','<div class="nt">📌 ကြိုဖြတ်သည် အဝယ် အမျိုးအစား။ Top 20 အဝယ်မှာ ပါဝင်ပါတယ်။</div>'+entryForm('pc','precut','ကြိုဖြတ်အသစ်')+'<div class="cd"><h3>📋 ('+db.precuts.length+')</h3>'+(h||'<div class="ep">မရှိ</div>')+'</div>');addIt('pc',null,null,null,null,true);}
function addDel(pId){var p=db.precuts.find(function(x){return x.id===pId;});if(!p)return;var rem={};for(var i=0;i<p.items.length;i++){var it=p.items[i];var d=0;for(var j=0;j<(p.deliveries||[]).length;j++)if(p.deliveries[j].item===it.item)d+=N(p.deliveries[j].w);rem[it.item]=N(it.w)-d;}var avail=[];for(var k in rem)if(rem[k]>0.001)avail.push(k);if(!avail.length)return alert('သွင်းပြီး');var item=avail.length===1?avail[0]:prompt('ပစ္စည်း',avail[0]);if(!item||!rem[item])return;var w=prompt('ပိဿာ (ကျန် '+qty(rem[item])+')',rem[item]);if(w===null)return;var wt=N(w);if(wt<=0||wt>rem[item]+0.01)return alert('မှန်ကန်စွာ');p.deliveries=p.deliveries||[];p.deliveries.push({id:uid(),date:today(),item:item,w:wt,note:''});save();precut();}

function loan(){var list=db.loans.slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date));}).slice(0,30);var h='';for(var k=0;k<list.length;k++){var l=list[k];var pd=sum(l.payments,'amount'),rm=N(l.amount)-pd;var payh='';for(var i=0;i<(l.payments||[]).length;i++){var p=l.payments[i];payh+='<div class="mt" style="margin-left:10px">↳ '+esc(p.date)+' · '+money(p.amount)+(p.bank?' · 🏦 '+esc(p.bank):'')+' <button class="dg sm" onclick="delSub(\'loan\','+l.id+','+p.id+')">×</button></div>'+thumb(p.photo);}h+='<div class="rc"><div><b>'+esc(l.person)+'</b> — '+money(l.amount)+' · '+esc(l.date)+'</div><div class="mt">ဆပ်ပြီး: '+money(pd)+' · <b>ကျန်: '+money(rm)+'</b></div>'+payh+'<div class="row" style="margin-top:4px"><button class="sf sm" onclick="loanPay('+l.id+')">➕ ဆပ်</button><button class="dg sm" onclick="delTx(\'loans\','+l.id+')">🗑️</button></div></div>';}shell('💵 ငွေချေး','<div class="cd"><h3>ချေးအသစ်</h3><div class="row"><label>ရက်စွဲ <input id="ldate" type="date" value="'+today()+'"></label><label>Customer <input id="lperson" list="lL"><datalist id="lL">'+cList()+'</datalist></label></div><div class="row"><label>ပမာဏ <input id="lamt" type="number"></label><label>အတိုး% <input id="lrate" type="number" value="0"></label></div><label>မှတ်ချက် <input id="lnote"></label><button onclick="saveLoan()">💾</button></div><div class="cd"><h3>📋</h3>'+(h||'<div class="ep">မရှိ</div>')+'</div>');}
function saveLoan(){var p=document.getElementById('lperson').value.trim(),a=N(document.getElementById('lamt').value);if(!p||!a)return alert('ဖြည့်ပါ');addC(p);db.loans.push({id:uid(),date:document.getElementById('ldate').value,person:p,amount:a,rate:N(document.getElementById('lrate').value),payments:[],note:document.getElementById('lnote').value});save();alert('✅');loan();}

var _lp=null;
function loanPay(id){var l=db.loans.find(function(x){return x.id===id;});if(!l)return;var rm=N(l.amount)-sum(l.payments,'amount');if(rm<=0)return alert('ဆပ်ပြီး');_lp={id:id,photo:''};mod.innerHTML='<div class="md" onclick="closeLP()"><div class="bx" onclick="event.stopPropagation()"><button class="cl" onclick="closeLP()">✕</button><h3 style="margin-top:0">💰 ချေးငွေပြန်ဆပ်</h3><div class="mt">'+esc(l.person)+' · ကျန် '+money(rm)+'</div><div class="row"><label>ရက်စွဲ <input id="lp_date" type="date" value="'+today()+'"></label><label>ပမာဏ <input id="lp_amt" type="number" step="any" value="'+rm+'"></label></div><label>🏦 ဘဏ်</label><select id="lp_bank"><option value="">— မရွေး —</option>';for(var i=0;i<BANKS.length;i++)mod.innerHTML+='<option>'+BANKS[i]+'</option>';mod.innerHTML+='</select><label>မှတ်ချက် <input id="lp_note"></label><div class="pb"><label>📷 ဘဏ်ချလံ</label><div id="lpPP"></div><input type="file" accept="image/*" capture="environment" onchange="selLPP(this)"></div><div style="margin-top:10px;display:flex;gap:6px"><button onclick="saveLoanPay()" style="flex:1">💾 သိမ်း</button><button class="sf" onclick="closeLP()" style="flex:1">✖</button></div></div></div>';}
function closeLP(){_lp=null;closeM();}

function savePay(){if(!_pp)return;var arr=_pp.kind==='sale'?db.sales:db.purchases;var r=arr.find(function(x){return x.id===_pp.id;});if(!r)return;var amt=N(document.getElementById('p_amount').value);if(amt<=0)return alert('ပမာဏ');var bank=document.getElementById('p_bank').value;if(bank==='အခြား')bank=document.getElementById('p_bank_other').value.trim();var date=document.getElementById('p_date').value,note=document.getElementById('p_note').value;if(_pp.editId){var p=r.payments.find(function(x){return x.id===_pp.editId;});if(p){p.date=date;p.amount=amt;p.bank=bank;p.note=note;p.photo=_pp.photo;}}else{r.payments=r.payments||[];r.payments.push({id:uid(),date:date,amount:amt,bank:bank,note:note,photo:_pp.photo});}save();closePay();alert('✅');render(curP());}

var _ec=null,_ep='',_ecp='',_eip='';
function openEdit(kind,id){var M={purchase:'purchases',sale:'sales',precut:'precuts',deposit:'deposits',car:'cars'};var an=M[kind];if(!an)return;var r=db[an].find(function(x){return x.id===id;});if(!r)return;_ec={kind:kind,id:id,an:an,r:r};_ep=r.photo||'';_ecp=r.carPhoto||'';_eip=r.invoicePhoto||'';var T={purchase:'📥 အဝယ်ပြင်',sale:'📤 အရောင်းပြင်',precut:'✂️ ကြိုဖြတ်ပြင်',deposit:'📦 အပ်ပြင်',car:'🚛 ကားတင်ပြင်'};var body='';if(['purchase','sale','precut','deposit'].indexOf(kind)>=0)body=txEdit(kind,r);else if(kind==='car')body=carEdit(r);mod.innerHTML='<div class="md" onclick="closeE()"><div class="bx" onclick="event.stopPropagation()"><button class="cl" onclick="closeE()">✕</button><h3 style="margin-top:0">'+T[kind]+'</h3>'+body+'<div style="margin-top:10px;display:flex;gap:6px"><button onclick="saveE()" style="flex:1">💾 သိမ်း</button><button class="sf" onclick="closeE()" style="flex:1">✖</button></div></div></div>';if(['purchase','sale','precut','deposit'].indexOf(kind)>=0){var wb=kind!=='sale';for(var i=0;i<r.items.length;i++){var it=r.items[i];addIt('e',it.item,it.w,it.price,it.bags,wb);}}if(kind==='car')for(var i=0;i<r.items.length;i++){var it=r.items[i];addBg('e',it.item,it.bags,it.wpb);}refreshEP();}
function closeE(){_ec=null;_ep='';_ecp='';_eip='';closeM();}
function selEP(inp,w){if(!_ec)return;var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var mx=600,sc=Math.min(1,mx/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);var d=c.toDataURL('image/jpeg',.6);if(w==='photo')_ep=d;else if(w==='carPhoto')_ecp=d;else _eip=d;refreshEP();};im.src=r.result;};r.readAsDataURL(f);}
function rmEP(w){if(w==='photo')_ep='';else if(w==='carPhoto')_ecp='';else _eip='';refreshEP();}
function refreshEP(){function set(id,src,w){var el=document.getElementById(id);if(!el)return;el.innerHTML=src?'<img class="th" src="'+src+'" onclick="viewImg(this.src)"><button class="dg sm" type="button" onclick="rmEP(\''+w+'\')">🗑️</button>':'<div class="mt">ပုံမရှိ</div>';}set('ePP',_ep,'photo');set('eCPP',_ecp,'carPhoto');set('eIPP',_eip,'invoicePhoto');}
function txEdit(kind,r){var isSale=kind==='sale',wb=!isSale;var custDl='<datalist id="ePL">'+cList()+'</datalist>';return '<div class="row"><label>ရက်စွဲ <input id="e_date" type="date" value="'+esc(r.date)+'"></label><label>Customer <input id="e_person" list="ePL" value="'+esc(r.person)+'">'+custDl+'</label></div>'+(isSale?'':'<div class="row"><label>ကားဆရာ <input id="e_driver" value="'+esc(r.driverName||'')+'"></label><label>ကားခ rate <input id="e_carRate" type="number" step="any" value="'+N(r.carRate)+'" oninput="recalc(\'e\')"></label></div>')+'<label>📦 ပစ္စည်းများ</label><div id="e_items"></div><button class="sf sm" type="button" onclick="addIt(\'e\',null,null,null,null,'+wb+')">➕</button><div class="tot"><div><span>အလေးချိန်:</span><b id="e_weight">0</b></div><div><span>Gross:</span><b id="e_gross">0</b></div>'+(isSale?'':'<div><span>ကားခ:</span><b id="e_fee">0</b></div><div class="net"><span>Net:</span><b id="e_net">0</b></div>')+'</div><label>မှတ်ချက် <input id="e_note" value="'+esc(r.note||'')+'"></label><div class="pb"><label>📷 ပုံ</label><div id="ePP"></div><input type="file" accept="image/*" capture="environment" onchange="selEP(this,\'photo\')"></div>';}
function carEdit(r){var custDl='<datalist id="ePL">'+cList()+'</datalist>';return '<div class="row"><label>ရက်စွဲ <input id="e_date" type="date" value="'+esc(r.date)+'"></label><label>Customer <input id="e_person" list="ePL" value="'+esc(r.person)+'">'+custDl+'</label></div><div class="row"><label>ကားနံပါတ် <input id="e_carNo" value="'+esc(r.carNo||'')+'"></label><label>ကားဆရာ <input id="e_driver" value="'+esc(r.driverName||'')+'"></label></div><div class="row"><label>ဖုန်း <input id="e_driverPhone" value="'+esc(r.driverPhone||'')+'"></label></div><label>📦 ကုန်များ</label><div id="e_bags"></div><button class="sf sm" type="button" onclick="addBg(\'e\')">➕</button><div class="row"><label>ကားခ rate <input id="e_carRate" type="number" step="any" value="'+N(r.carRate)+'" oninput="recalcCar(\'e\')"></label></div><div class="tot"><div><span>Total ကုန်ချိန်:</span><b id="e_carWeight">0</b></div><div class="net"><span>ကားခ:</span><b id="e_carFee">0</b></div></div><label>ပို့ရမယ့်နေရာ <input id="e_deliverTo" value="'+esc(r.deliverTo||'')+'"></label><div class="pb"><label>🚛 ကားပုံ</label><div id="eCPP"></div><input type="file" accept="image/*" capture="environment" onchange="selEP(this,\'carPhoto\')"></div><div class="pb"><label>🧾 ဘောင်ချာပုံ</label><div id="eIPP"></div><input type="file" accept="image/*" capture="environment" onchange="selEP(this,\'invoicePhoto\')"></div>';}
function saveE(){if(!_ec)return;var kind=_ec.kind,an=_ec.an;var rec=db[an].find(function(x){return x.id===_ec.r.id;});if(!rec)return;if(['purchase','sale','precut','deposit'].indexOf(kind)>=0){var wb=kind!=='sale';var items=colIt('e',wb);if(!items.length)return alert('ပစ္စည်း');rec.date=document.getElementById('e_date').value;rec.person=document.getElementById('e_person').value.trim();rec.items=items;rec.grossAmount=items.reduce(function(s,it){return s+it.w*it.price;},0);if(kind!=='sale'){rec.driverName=document.getElementById('e_driver').value.trim();rec.carRate=Math.floor(N(document.getElementById('e_carRate').value));var fl=0;for(var i=0;i<items.length;i++)fl+=Math.floor(N(items[i].w));rec.carFee=rec.carRate*fl;}rec.netAmount=rec.grossAmount-(kind==='sale'?0:N(rec.carFee));rec.total=rec.netAmount;rec.note=document.getElementById('e_note').value;rec.photo=_ep;addC(rec.person);}else if(kind==='car'){var items=colBg('e');if(!items.length)return alert('ကုန်');rec.date=document.getElementById('e_date').value;rec.person=document.getElementById('e_person').value.trim();rec.carNo=document.getElementById('e_carNo').value.trim();rec.driverName=document.getElementById('e_driver').value.trim();rec.driverPhone=document.getElementById('e_driverPhone').value.trim();rec.items=items;rec.carRate=Math.floor(N(document.getElementById('e_carRate').value));rec.deliverTo=document.getElementById('e_deliverTo').value;rec.carPhoto=_ecp;rec.invoicePhoto=_eip;addC(rec.person,rec.driverPhone);}save();closeE();alert('✅');render(curP());}

function stockPage(){var h='';for(var i=0;i<db.items.length;i++){var k=db.items[i];h+='<tr><td>'+esc(k)+'</td><td><b>'+qty(stock(k))+'</b></td><td>'+money(avgBuy(k))+'</td><td>'+money(avgSell(k))+'</td></tr>';}shell('📦 Stock','<div class="cd"><table class="tbl"><tr><th>ပစ္စည်း</th><th>လက်ကျန်</th><th>Avg ဝယ်</th><th>Avg ရောင်း</th></tr>'+h+'</table></div>');}
function itemsPage(){var h='';for(var i=0;i<db.items.length;i++){var it=db.items[i];var bw=itemBought(it),sw=itemSold(it);if(bw===0&&sw===0)continue;var ab=avgBuy(it),as=avgSell(it);var profit=sw*(as-ab);h+='<tr><td><b>'+esc(it)+'</b></td><td>'+qty(bw-sw)+'</td><td>'+money(ab)+'</td><td>'+money(as)+'</td><td class="'+(profit>=0?'ps':'ng')+'"><b>'+money(profit)+'</b></td></tr>';}shell('📊 ပစ္စည်း','<div class="cd"><table class="tbl"><tr><th>ပစ္စည်း</th><th>လက်ကျန်</th><th>Avg ဝယ်</th><th>Avg ရောင်း</th><th>အမြတ်</th></tr>'+(h||'<tr><td colspan="5" class="ep">မရှိ</td></tr>')+'</table></div>');}

function dailyPage(){shell('📅 နေ့စဉ်','<div class="cd"><div class="row"><input id="dd" type="date" value="'+today()+'" onchange="rDaily()"></div><div id="dTbl"></div></div>');rDaily();}
function rDaily(){var d=document.getElementById('dd').value;var a=[];for(var i=0;i<db.purchases.length;i++){var x=db.purchases[i];if(x.date===d)a.push({date:x.date,person:x.person,item:brief(x.items),type:'အဝယ်',total:N(x.total)});}for(var i=0;i<db.sales.length;i++){var x=db.sales[i];if(x.date===d)a.push({date:x.date,person:x.person,item:brief(x.items),type:'အရောင်း',total:N(x.total)});}for(var i=0;i<db.precuts.length;i++){var x=db.precuts[i];if(x.date===d)a.push({date:x.date,person:x.person,item:brief(x.items),type:'ကြိုဖြတ်',total:N(x.total)});}for(var i=0;i<db.cars.length;i++){var x=db.cars[i];if(x.date===d)a.push({date:x.date,person:x.person,item:brief(x.items),type:'ကားတင်',total:carFee(x)});}for(var i=0;i<db.expenses.length;i++){var x=db.expenses[i];if(x.date===d)a.push({date:x.date,person:'',item:x.cat,type:'စရိတ်',total:N(x.amount)});}var h='';for(var i=0;i<a.length;i++)h+='<tr><td>'+esc(a[i].type)+'</td><td>'+esc(a[i].person||'')+'</td><td>'+esc(a[i].item||'')+'</td><td>'+money(N(a[i].total))+'</td></tr>';document.getElementById('dTbl').innerHTML='<table class="tbl"><tr><th>Type</th><th>Customer</th><th>Item</th><th>Amount</th></tr>'+(h||'<tr><td colspan="4" class="ep">မရှိ</td></tr>')+'</table>';}

function searchPage(){shell('🔍 ရှာ','<div class="cd"><input id="sq" placeholder="🔍" oninput="rSearch()"><div id="sTbl" style="margin-top:8px"></div></div>');rSearch();}
function rSearch(){var q=(document.getElementById('sq').value||'').toLowerCase();var a=[];function add(date,person,item,type,total){if(!q||(person+' '+item+' '+type).toLowerCase().indexOf(q)>=0)a.push({date:date,person:person,item:item,type:type,total:total});}for(var i=0;i<db.purchases.length;i++){var x=db.purchases[i];add(x.date,x.person,brief(x.items),'အဝယ်',N(x.total));}for(var i=0;i<db.sales.length;i++){var x=db.sales[i];add(x.date,x.person,brief(x.items),'အရောင်း',N(x.total));}for(var i=0;i<db.precuts.length;i++){var x=db.precuts[i];add(x.date,x.person,brief(x.items),'ကြိုဖြတ်',N(x.total));}a.sort(function(a,b){return String(b.date).localeCompare(String(a.date));});a=a.slice(0,100);var h='';for(var i=0;i<a.length;i++)h+='<tr><td>'+esc(a[i].date)+'</td><td>'+esc(a[i].type)+'</td><td>'+esc(a[i].person||'')+'</td><td>'+esc(a[i].item||'')+'</td><td>'+money(N(a[i].total))+'</td></tr>';document.getElementById('sTbl').innerHTML='<table class="tbl"><tr><th>Date</th><th>Type</th><th>Customer</th><th>Item</th><th>Amount</th></tr>'+(h||'<tr><td colspan="5" class="ep">မရှိ</td></tr>')+'</table>';}

function settingsPage(){var custH='',itemH='';for(var i=0;i<db.customers.length;i++)custH+='<span style="display:inline-block;padding:3px 7px;border-radius:15px;background:#e8efee;font-size:11px;margin:3px">'+esc(db.customers[i].name)+' <button class="dg sm" onclick="delC('+i+')">×</button></span>';for(var i=0;i<db.items.length;i++)itemH+='<span style="display:inline-block;padding:3px 7px;border-radius:15px;background:#e8efee;font-size:11px;margin:3px">'+esc(db.items[i])+' <button class="dg sm" onclick="delI('+i+')">×</button></span>';shell('⚙️ ဆက်တင်','<div class="cd"><h3>👤 Customer</h3><div class="row"><input id="nc" placeholder="အသစ်"><button onclick="addCFromSet()">➕</button></div><div style="margin-top:8px">'+custH+'</div></div><div class="cd"><h3>📦 ပစ္စည်း</h3><div class="row"><input id="ni" placeholder="အသစ်"><button onclick="addI()">➕</button></div><div style="margin-top:8px">'+itemH+'</div></div><div class="cd"><h3>💾 Backup</h3><button onclick="expData()">📥 Backup</button><br><br><label>Restore:</label><input type="file" accept=".json" onchange="impData(this)"></div>');}
function addCFromSet(){var n=document.getElementById('nc').value.trim();if(!n)return;addC(n);settingsPage();}
function delC(i){if(!confirm('ဖျက်မှာ?'))return;db.customers.splice(i,1);save();settingsPage();}
function addI(){var n=document.getElementById('ni').value.trim();if(!n)return;for(var i=0;i<db.items.length;i++)if(db.items[i]===n)return alert('ရှိပြီး');db.items.push(n);save();settingsPage();}
function delI(i){if(!confirm('ဖျက်မှာ?'))return;db.items.splice(i,1);save();settingsPage();}
function expData(){var u=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));var a=document.createElement('a');a.href=u;a.download='ptt_'+today()+'.json';document.body.appendChild(a);a.click();a.remove();}
function impData(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){try{var i=JSON.parse(e.target.result);if(confirm('အစားထိုးမှာ?')){db=i;save();location.reload();}}catch(err){alert('❌');}};r.readAsText(f);}

function applyTheme(){var t=localStorage.getItem(TH)||'light';if(t==='dark')document.body.classList.add('dk');var b=document.getElementById('themeBtn');if(b)b.innerText=t==='dark'?'☀️':'🌙';}
function tglTheme(){var t=localStorage.getItem(TH)==='dark'?'light':'dark';localStorage.setItem(TH,t);applyTheme();}
applyTheme();
render(curP());
</script>
</body>
